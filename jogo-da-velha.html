<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080d1b"><title>Jogo da Velha</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 10%,#123047,#080d1b 42%,#050811);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));display:grid;place-items:center}.app{width:min(100%,430px);padding:20px;border:1px solid #29344e;border-radius:26px;background:#151d33;box-shadow:0 24px 70px #0007}.head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center}.back{width:40px;height:40px;border:1px solid #33405f;border-radius:13px;background:#0c1428;color:#fff;font-size:28px}.head h1{margin:0;font-size:28px}.head p{margin:2px 0 0;color:#a8b3cc;font-size:12px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:18px 0 14px;border-radius:14px;background:#080d1b}.seg button{min-height:42px;border:0;border-radius:10px;background:transparent;color:#a8b3cc;font-weight:800}.seg button.on{background:#2a3654;color:#fff}.status{text-align:center;font-size:19px;font-weight:800;min-height:28px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(82vw,350px);aspect-ratio:1;margin:0 auto 18px}.cell{border:1px solid #34405f;border-radius:18px;background:#09101f;color:#5eead4;font-size:clamp(44px,16vw,72px);font-weight:900}.cell.o{color:#fbbf24}.cell.win{border-color:currentColor;background:#ffffff12}.primary{width:100%;min-height:49px;border:0;border-radius:12px;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#041311;font-weight:900}.offline{text-align:center;color:#6ee7b7;font-size:10px;margin-top:12px}
button{touch-action:manipulation}</style><link rel="stylesheet" href="./v5-social.css"></head><body><main class="app"><div class="head"><button class="back" onclick="location.href='index.html'">‹</button><div><h1>Jogo da Velha</h1><p>Clássico rápido</p></div><span></span></div><div class="seg"><button id="duo" class="on" onclick="mode('duo')">2 jogadores</button><button id="cpu" onclick="mode('cpu')">Contra iPhone</button></div><div class="status" id="st">Vez do X</div><div class="board" id="board"></div><button class="primary" onclick="reset()">Jogar novamente</button><div class="offline">✓ Funciona sem internet</div></main><script>
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b=Array(9).fill(''),turn='X',m='duo',done=false;
const g=x=>document.getElementById(x);function outcome(a){for(const l of W){let[x,y,z]=l;if(a[x]&&a[x]===a[y]&&a[x]===a[z])return{w:a[x],l}}return a.every(Boolean)?{w:'draw',l:[]}:null}
function render(){g('board').innerHTML=b.map((v,i)=>`<button class="cell ${v.toLowerCase()} ${outcome(b)?.l.includes(i)?'win':''}" onclick="play(${i})">${v}</button>`).join('');let o=outcome(b);g('st').textContent=o?(o.w==='draw'?'Deu velha!':o.w+' venceu!'):'Vez do '+turn}
function mode(x){m=x;g('duo').classList.toggle('on',x==='duo');g('cpu').classList.toggle('on',x==='cpu');reset()}
function reset(){b=Array(9).fill('');turn='X';done=false;render()}
function score(a,max){let o=outcome(a);if(o)return o.w==='O'?10:o.w==='X'?-10:0;let best=max?-99:99;a.forEach((v,i)=>{if(v)return;a[i]=max?'O':'X';let s=score(a,!max);a[i]='';best=max?Math.max(best,s):Math.min(best,s)});return best}
function cpuMove(){let best=-99,idx=0;b.forEach((v,i)=>{if(v)return;b[i]='O';let s=score(b,false);b[i]='';if(s>best){best=s;idx=i}});b[idx]='O';turn='X';render()}
function play(i){if(done||b[i]||(m==='cpu'&&turn==='O'))return;b[i]=turn;let o=outcome(b);if(o){done=true;render();return}if(m==='duo'){turn=turn==='X'?'O':'X';render()}else{turn='O';render();setTimeout(()=>{if(!done){cpuMove();if(outcome(b))done=true}},250)}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="./v5-social.js"></script></body></html>
