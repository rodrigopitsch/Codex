name: Build mobile apps

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.webmanifest'
      - 'a13v3/**'
      - 'mobile/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK + Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add and sync Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate Android icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile/assets --iconBackgroundColor '#050711' --iconBackgroundColorDark '#050711' --splashBackgroundColor '#050711' --splashBackgroundColorDark '#050711'
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Boot Android Emulator and launch Sala 13
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | head -n 1)
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -x "$ADB"
          test -x "$EMULATOR"
          echo no | "$AVDMANAGER" create avd --force --name sala13-ci --package 'system-images;android-35;google_apis;x86_64'
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          "$ADB" kill-server || true
          "$ADB" start-server
          "$EMULATOR" -avd sala13-ci -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          BOOTED=0
          for i in {1..120}; do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo 'Android Emulator exited before boot' >&2
              cat /tmp/emulator.log >&2 || true
              exit 1
            fi
            if "$ADB" get-state >/dev/null 2>&1; then
              if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                BOOTED=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            echo 'Android Emulator did not finish booting' >&2
            cat /tmp/emulator.log >&2 || true
            exit 1
          fi
          "$ADB" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell am force-stop com.rodrigopitsch.sala13
          "$ADB" shell am start -W -n com.rodrigopitsch.sala13/.MainActivity | tee /tmp/start.txt
          grep -Eq 'Status: ok|ThisTime:' /tmp/start.txt
          sleep 4
          "$ADB" shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.rodrigopitsch.sala13'
          "$ADB" exec-out screencap -p > Sala13-Android-smoke.png
          if "$ADB" logcat -d -t 400 | grep -A8 -B3 'FATAL EXCEPTION' | grep -q 'com.rodrigopitsch.sala13'; then
            echo 'Fatal exception detected in Sala 13' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Sala13-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Sala13-Android-smoke.png
          if-no-files-found: error

  ios:
    name: iOS Simulator smoke test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Generate iOS icon and splash
        run: npx @capacitor/assets generate --ios --assetPath mobile/assets --iconBackgroundColor '#050711' --iconBackgroundColorDark '#050711' --splashBackgroundColor '#050711' --splashBackgroundColorDark '#050711'
      - name: Build for iOS Simulator without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Boot iPhone Simulator, install and launch Sala 13
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [ -z "$UDID" ]; then
            echo 'No available iPhone Simulator found' >&2
            exit 1
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH='build/Build/Products/Debug-iphonesimulator/App.app'
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUT=$(xcrun simctl launch "$UDID" com.rodrigopitsch.sala13)
          echo "$LAUNCH_OUT"
          echo "$LAUNCH_OUT" | grep 'com.rodrigopitsch.sala13:'
          sleep 4
          xcrun simctl io "$UDID" screenshot Sala13-iOS-smoke.png
      - name: Package iOS Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app Sala13-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sala13-iOS-Simulator
          path: |
            Sala13-iOS-Simulator.zip
            Sala13-iOS-smoke.png
          if-no-files-found: error
