name: Build mobile apps

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.webmanifest'
      - 'a13v3/**'
      - 'mobile/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add and sync Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate Android icon and splash
        run: npx @capacitor/assets generate --android --assetPath mobile/assets --iconBackgroundColor '#050711' --iconBackgroundColorDark '#050711' --splashBackgroundColor '#050711' --splashBackgroundColorDark '#050711'
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sala13-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run mobile:prepare
      - name: Add and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Generate iOS icon and splash
        run: npx @capacitor/assets generate --ios --assetPath mobile/assets --iconBackgroundColor '#050711' --iconBackgroundColorDark '#050711' --splashBackgroundColor '#050711' --splashBackgroundColorDark '#050711'
      - name: Build for iOS Simulator without signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package iOS Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app Sala13-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sala13-iOS-Simulator
          path: Sala13-iOS-Simulator.zip
          if-no-files-found: error
