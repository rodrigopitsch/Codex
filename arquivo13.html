<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050711"><title>Arquivo 13 — carregando</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#050711;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{text-align:center;padding:24px}b{display:block;font-size:20px}p{color:#9aa9c3;font-size:13px}</style></head><body><main><b>ARQUIVO 13</b><p id="msg">Preparando a caçada…</p></main><script>(async()=>{const parts=['./a13v3/part00.txt','./a13v3/part01.txt','./a13v3/part02.txt','./a13v3/part03.txt','./a13v3/part04.txt','./a13v3/part05.txt','./a13v3/part06.txt','./a13v3/part07.txt'];try{const out=[];const cache=typeof caches!=='undefined'?await caches.open('sala-jogos-offline-v15'):null;for(const u of parts){let r=null;try{r=await fetch(u,{cache:'reload'});if(r&&r.ok&&cache)await cache.put(u,r.clone())}catch(e){}if((!r||!r.ok)&&cache)r=await cache.match(u,{ignoreSearch:true});if(!r||!r.ok)throw new Error('parte indisponível');out.push(await r.text())}document.open();document.write(out.join(''));document.close()}catch(e){document.getElementById('msg').textContent='Arquivo 13 não foi totalmente salvo. Abra a Sala conectado até aparecer OFFLINE COMPLETO.'}})();</script></body></html>
