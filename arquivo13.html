<script>
(()=>{

const stage=$('stage'),overlay=$('overlay'),panel=$('panel'),objective=$('objective'),toastEl=$('toast'),bossBar=$('bossBar');
const SAVE_KEY='arquivo13_save_v2';

};

function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.version===2)return s}catch(e){}return {version:2,level:1,xp:0,ess:0,unlocked:1,completed:0,lifeUp:0,powerUp:0,sound:true,best:{}}}
function persist(){save.sound=sound;localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderRank()}

function initAudio(){if(audio||!sound)return;try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audio=null}}
function tone(freq=440,dur=.07,type='square',gain=.035){if(!sound)return;initAudio();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audio.destination);const t=audio.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur)}
function sfx(name){if(name==='jump')tone(330,.06,'square',.03);if(name==='shoot'){tone(740,.05,'square',.025);setTimeout(()=>tone(980,.04,'square',.018),30)}if(name==='hit')tone(120,.12,'sawtooth',.045);if(name==='orb')tone(920,.05,'triangle',.025);if(name==='clue'){tone(520,.08,'triangle',.03);setTimeout(()=>tone(780,.1,'triangle',.025),80)}if(name==='boss')tone(78,.25,'sawtooth',.05);if(name==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.1,'triangle',.03),i*90))}}

function resize(){const oldGround=groundY(),r=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';const aspect=Math.max(.55,r.width/Math.max(1,r.height));view.h=aspect<1.25?360:aspect<1.55?315:270;view.w=view.h*aspect;view.scale=r.width/view.w;view.ox=0;view.oy=0;ctx.setTransform(dpr*view.scale,0,0,dpr*view.scale,0,0);ctx.imageSmoothingEnabled=false;const newGround=groundY(),dy=newGround-oldGround;if(dy&&player&&platforms.length){player.y+=dy;platforms.forEach(q=>q.y+=dy);hazards.forEach(q=>q.y+=dy);enemies.forEach(q=>q.y+=dy);orbs.forEach(q=>q.y+=dy);clues.forEach(q=>q.y+=dy);particles.forEach(q=>q.y+=dy);shots.forEach(q=>q.y+=dy);if(boss)boss.y+=dy;if(portal)portal.y+=dy;if(checkpoint)checkpoint.y+=dy;}}

function menu(){state='menu';overlay.classList.add('on');bossBar.classList.remove('on');const c=CASES[caseIndex];panel.innerHTML=`<div class="kicker">arquivo independente // campanha</div><h1>Arquivo 13</h1><p>Plataforma 2D sobrenatural. Corra, pule, use a relíquia e resolva casos curtos com progressão permanente.</p><div class="story"><b>CASO ${String(caseIndex+1).padStart(2,'0')} — ${c.title}</b><small>${c.story}</small></div><div class="stats"><div class="stat"><b>${save.level}</b><small>NÍVEL</small></div><div class="stat"><b>${save.ess}</b><small>ESSÊNCIA</small></div><div class="stat"><b>${save.completed}/${CASES.length}</b><small>CASOS</small></div></div><div class="caseList">${CASES.map((q,i)=>`<button class="caseBtn ${i>=save.unlocked?'lock':''} ${i===caseIndex?'current':''}" data-case="${i}" ${i>=save.unlocked?'disabled':''}><span class="caseNum">${String(i+1).padStart(2,'0')}</span><span><b>${q.title}</b><small>${q.sub}</small></span><em>${save.best[i]?'✓':''}</em></button>`).join('')}</div><div class="upgrades"><button class="upgrade" data-up="life"><b>+1 ❤️ VIDA • 35 ESS</b><small>Atual: +${save.lifeUp}</small></button><button class="upgrade" data-up="power"><b>+1 ✦ PODER • 45 ESS</b><small>Atual: +${save.powerUp}</small></button></div><div class="btns"><button class="btn" id="helpBtn">COMO JOGAR</button><button class="btn primary" id="playBtn">INICIAR CASO</button></div>`;panel.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{caseIndex=+b.dataset.case;menu()}));panel.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>buyUpgrade(b.dataset.up)));$('playBtn').onclick=()=>startCase();$('helpBtn').onclick=help;}

function buildWorld(){const c=CASES[caseIndex],L=c.length,maxHp=5+save.lifeUp;gameTime=0;camera.x=0;camera.shake=0;player={x:60,y:0,w:20,h:34,vx:0,vy:0,dir:1,onGround:false,coyote:0,jumpBuffer:0,hp:maxHp,maxHp,inv:0,shootCd:0,ess:0,clues:0,anim:0,checkpointX:60,checkpointEss:0,checkpointClues:0};shots=[];enemies=[];orbs=[];clues=[];platforms=[];hazards=[];particles=[];boss=null;portal={x:L-110,y:0,w:34,h:54,open:false};checkpoint=null;const gy=groundY();platforms.push({x:-200,y:gy,w:L+400,h:120,type:'ground'});const pattern=[420,690,980,1280,1570,1890,2200,2530,2860,3200,3510];pattern.forEach((x0,i)=>{const y=gy-(i%3===0?48:i%3===1?76:58)-(caseIndex%2?12:0);platforms.push({x:x0,y,w:110+(i%2)*35,h:14,type:'stone'});if(i===3||i===7)platforms.push({x:x0+165,y:gy-34,w:70,h:12,type:'stone'})});if(L>4600){platforms.push({x:3860,y:gy-82,w:130,h:14,type:'stone'});platforms.push({x:4140,y:gy-52,w:120,h:14,type:'stone'})}if(L>5200){platforms.push({x:4540,y:gy-92,w:150,h:14,type:'stone'})}const enemyXs=[];for(let x=580,i=0;x<L-650;x+=360+(i%3)*70,i++)enemyXs.push(x);enemyXs.forEach((x0,i)=>enemies.push(makeEnemy(x0,i%4===0?'hound':i%3===0?'shade':'ghost',i)));for(let x=340,i=0;x<L-520;x+=270,i++)orbs.push({x,y:gy-44-(i%4)*34,r:5,on:true,t:Math.random()*6});const cluePos=[Math.round(L*.23),Math.round(L*.49),Math.round(L*.73)];clues=cluePos.map((x0,i)=>({x:x0,y:gy-85-(i%2)*18,w:18,h:22,on:true,t:i}));hazards=[{x:1130,y:gy-8,w:58,h:8},{x:2360,y:gy-8,w:70,h:8},{x:caseIndex>1?3740:99999,y:gy-8,w:64,h:8}];const bossX=L-430;boss={x:bossX,y:gy-64,w:50,h:64,hp:18+caseIndex*7+save.level*2,maxHp:18+caseIndex*7+save.level*2,dir:-1,vx:0,vy:0,on:true,phase:1,attackCd:1.3,awake:false,type:c.bossType};portal.y=gy-54;player.y=gy-player.h;checkpoint={x:Math.round(L*.52),y:gy-48,w:20,h:48,lit:false};updateHud();}
function makeEnemy(x0,type,i){const gy=groundY();if(type==='ghost')return{x:x0,y:gy-60-(i%2)*18,w:28,h:32,type,hp:2+Math.floor(caseIndex/2),maxHp:2+Math.floor(caseIndex/2),dir:i%2?1:-1,base:x0,speed:.55+.08*caseIndex,hit:0,on:true,phase:Math.random()*6};if(type==='hound')return{x:x0,y:gy-24,w:38,h:24,type,hp:3+Math.floor(caseIndex/2),maxHp:3+Math.floor(caseIndex/2),dir:i%2?1:-1,base:x0,speed:1+.1*caseIndex,hit:0,on:true,phase:0};return{x:x0,y:gy-35,w:26,h:35,type,hp:3+Math.floor(caseIndex/2),maxHp:3+Math.floor(caseIndex/2),dir:i%2?1:-1,base:x0,speed:.7+.08*caseIndex,hit:0,on:true,phase:0}}

function physics(dt){const move=3.1+Math.min(.45,save.level*.03);if(keys.left){player.vx-=18*dt;player.dir=-1}else if(keys.right){player.vx+=18*dt;player.dir=1}else player.vx*=Math.pow(.0005,dt);player.vx=Math.max(-move,Math.min(move,player.vx));player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);if(jumpPressed){player.jumpBuffer=.12;jumpPressed=false}if(player.onGround)player.coyote=.1;else player.coyote=Math.max(0,player.coyote-dt);if(player.jumpBuffer>0&&player.coyote>0){player.vy=-7.35;player.jumpBuffer=0;player.coyote=0;player.onGround=false;sfx('jump')}if(!keys.jump&&player.vy<0)player.vy+=17*dt;player.vy=Math.min(9,player.vy+18*dt);player.x+=player.vx*60*dt;player.x=Math.max(0,Math.min(CASES[caseIndex].length-player.w,player.x));const oldBottom=player.y+player.h;player.y+=player.vy*60*dt;player.onGround=false;for(const q of platforms){if(player.vy>=0&&player.x+player.w>q.x&&player.x<q.x+q.w&&oldBottom<=q.y+5&&player.y+player.h>=q.y){player.y=q.y-player.h;player.vy=0;player.onGround=true;break}}if(player.y>view.h+140){damage(99,player.x-1);respawn()}if(shootPressed||keys.shoot){shoot();shootPressed=false}player.shootCd=Math.max(0,player.shootCd-dt);player.inv=Math.max(0,player.inv-dt);player.anim+=dt*(Math.abs(player.vx)>0.2?10:3)}

function updateBoss(dt){if(!boss||!boss.on)return;if(!boss.awake&&player.x>boss.x-260){boss.awake=true;bossBar.classList.add('on');sfx('boss');objectiveMsg('CHEFE: encontre a abertura e use a relíquia.',2.5)}if(!boss.awake)return;boss.phase=boss.hp<boss.maxHp*.5?2:1;boss.attackCd-=dt;const speed=(boss.phase===2?1.35:.85)+caseIndex*.05;boss.dir=player.x>boss.x?1:-1;boss.x+=boss.dir*speed*60*dt;if(boss.attackCd<=0){boss.attackCd=boss.phase===2?.95:1.45;boss.vy=-5.8;burst(boss.x+25,boss.y+30,'#ff7ca8',9,4)}boss.vy=Math.min(8,(boss.vy||0)+18*dt);const gy=groundY();boss.y+=boss.vy*60*dt;if(boss.y+boss.h>=gy){boss.y=gy-boss.h;boss.vy=0}if(rects(player,boss))damage(1,boss.x);for(const s of shots){if(s.life>0&&rects(s,boss)){boss.hp-=s.power;s.life=0;camera.shake=4;burst(s.x,s.y,'#ffd36b',7,3);if(boss.hp<=0){boss.on=false;bossBar.classList.remove('on');player.ess+=12+caseIndex*3;portal.open=player.clues>=3;sfx('win');burst(boss.x+25,boss.y+25,'#ffe39a',28,6);if(portal.open)objectiveMsg('Maldição quebrada. Entre no portal.',4);else objectiveMsg('Chefe derrotado, mas ainda faltam pistas.',4);updateHud()}}}$('bossFill').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%';$('bossName').textContent=CASES[caseIndex].boss.toUpperCase();$('bossPhase').textContent='FASE '+boss.phase}

function draw(){const c=CASES[caseIndex],t=THEMES[c.theme],w=view.w,h=view.h,gy=groundY();ctx.setTransform((canvas.width/stage.clientWidth)*view.scale,0,0,(canvas.height/stage.clientHeight)*view.scale,0,0);const shakeX=camera.shake?(Math.random()-.5)*camera.shake:0,shakeY=camera.shake?(Math.random()-.5)*camera.shake*.6:0;drawSky(t,w,h);ctx.save();ctx.translate(-Math.floor(camera.x)+shakeX,shakeY);drawFar(t,w,h,gy);drawMid(t,w,h,gy);drawWorld(t,gy);ctx.restore();drawVignette(w,h)}

function drawCheckpoint(cp,t){ctx.fillStyle='#2b2115';ctx.fillRect(cp.x,cp.y,4,48);ctx.fillRect(cp.x-2,cp.y,18,3);ctx.fillStyle=cp.lit?'#72ddff':'#5d6572';ctx.globalAlpha=cp.lit?.28:.1;ctx.beginPath();ctx.arc(cp.x+10,cp.y+10,13,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillRect(cp.x+7,cp.y+5,7,12)}
function drawBoss(b,t){ctx.fillStyle=b.phase===2?'#672445':'#3d254c';ctx.fillRect(b.x+8,b.y+10,b.w-16,b.h-10);ctx.fillRect(b.x+2,b.y+24,b.w-4,b.h-30);ctx.fillStyle='#09080c';ctx.fillRect(b.x+14,b.y+14,b.w-28,18);ctx.fillStyle=t.accent;ctx.fillRect(b.x+(b.dir>0?b.w-19:15),b.y+20,4,4);ctx.globalAlpha=.18;ctx.fillStyle=t.accent;ctx.fillRect(b.x-7,b.y+4,b.w+14,b.h+10);ctx.globalAlpha=1}
function drawPortal(p,t){ctx.strokeStyle=p.open?t.accent:'#343744';ctx.lineWidth=3;ctx.strokeRect(p.x,p.y,p.w,p.h);if(p.open){ctx.globalAlpha=.3+.15*Math.sin(gameTime*4);ctx.fillStyle=t.accent;ctx.fillRect(p.x+5,p.y+5,p.w-10,p.h-10);ctx.globalAlpha=1}else{ctx.fillStyle='#242634';ctx.fillRect(p.x+5,p.y+5,p.w-10,p.h-10)}}
function drawShot(s,t){ctx.globalAlpha=.26;ctx.fillStyle=t.accent;ctx.fillRect(s.x-4,s.y-4,s.w+8,s.h+8);ctx.globalAlpha=1;ctx.fillStyle='#ffe69a';ctx.fillRect(s.x,s.y+2,s.w,2);ctx.fillRect(s.x+4,s.y-2,2,s.h+4)}
function drawPlayer(p,t){if(p.inv>0&&Math.floor(p.inv*18)%2===0)return;const moving=Math.abs(p.vx)>.35,frame=moving?(Math.floor(p.anim)%2?SPRITES.playerRun1:SPRITES.playerRun2):SPRITES.playerIdle;paintSprite(frame,PAL,Math.round(p.x),Math.round(p.y),2,p.dir<0);const gx=p.dir>0?p.x+p.w+1:p.x-5,gy=p.y+16;ctx.globalAlpha=.22;ctx.fillStyle=t.accent;ctx.fillRect(gx-3,gy-3,8,8);ctx.globalAlpha=1;ctx.fillStyle='#ffe69a';ctx.fillRect(gx,gy,3,3)}
function drawVignette(w,h){const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.75);g.addColorStop(0,'#0000');g.addColorStop(1,'#0009');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function tick(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='play'){updateWorld(dt);if(objectiveTimer>0){objectiveTimer-=dt;if(objectiveTimer<=0)objective.classList.add('hide')}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toastEl.classList.remove('on')}}if(state==='play'||state==='pause'||state==='dead')draw();requestAnimationFrame(tick)}
function keyDown(k){if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='jump'){if(!keys.jump)jumpPressed=true;keys.jump=true}if(k==='shoot'){if(!keys.shoot)shootPressed=true;keys.shoot=true}}
function keyUp(k){keys[k]=false}
function bindControls(){document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();initAudio();b.classList.add('on');keyDown(k)};const up=e=>{e.preventDefault();b.classList.remove('on');keyUp(k)};b.addEventListener('pointerdown',down,{passive:false});b.addEventListener('pointerup',up,{passive:false});b.addEventListener('pointercancel',up,{passive:false});b.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e)},{passive:false})});window.addEventListener('keydown',e=>{const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyJ:'shoot',KeyK:'shoot'};if(map[e.code]){e.preventDefault();keyDown(map[e.code])}});window.addEventListener('keyup',e=>{const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyJ:'shoot',KeyK:'shoot'};if(map[e.code])keyUp(map[e.code])})}
$('menuBtn').onclick=()=>state==='play'?pause():menu();$('backBtn').onclick=()=>{if(state==='play')pause();else location.href='index.html'};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';persist();if(sound)initAudio()};$('soundBtn').textContent=sound?'🔊':'🔇';
window.addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});preventGestures();bindControls();resize();renderRank();menu();requestAnimationFrame(tick);
})();
</script>
