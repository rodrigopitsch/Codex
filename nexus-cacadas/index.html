<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050711">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEXUS — Caçadas Entre Mundos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050711;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;overflow:hidden}.boot{width:min(88vw,520px);text-align:center;padding:28px}.mark{font-size:11px;font-weight:900;letter-spacing:.22em;color:#b88cff}.boot h1{margin:8px 0 6px;font-size:clamp(28px,8vw,48px);line-height:.95}.boot p{color:#9aa9c3;font-size:12px;line-height:1.5}.bar{height:4px;margin:18px auto 0;max-width:260px;border-radius:99px;overflow:hidden;background:#171d2c}.bar i{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7550c5,#72ddff);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(185%)}}.err{color:#ff9ca8!important}
</style>
</head>
<body>
<main class="boot"><div class="mark">NEXUS // MULTIVERSO</div><h1>Caçadas Entre Mundos</h1><p id="msg">Carregando o núcleo do Arquivo 13 e preparando os universos…</p><div class="bar"><i></i></div></main>
<script>
(async()=>{
'use strict';
const ROOT='https://raw.githubusercontent.com/rodrigopitsch/Codex/main/';
const parts=Array.from({length:8},(_,i)=>`${ROOT}a13v3/part${String(i).padStart(2,'0')}.txt`);
const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`Falha ao carregar ${url.split('/').pop()}`);return r.text()};
let source=(await Promise.all(parts.map(get))).join('');

// Identidade independente, sem alterar o Arquivo 13 original.
source=source
 .replaceAll('Arquivo 13 — Caçada 2D','NEXUS — Caçadas Entre Mundos')
 .replaceAll('ARQUIVO 13 — CAÇADA 2D','NEXUS — CAÇADAS ENTRE MUNDOS')
 .replaceAll('Arquivo 13','NEXUS')
 .replaceAll('ARQUIVO 13','NEXUS')
 .replace("const SAVE_KEY='arquivo13_save_v2';","const SAVE_KEY='nexus_cacadas_save_v1';")
 .replaceAll('plataforma sobrenatural • progresso independente','multiverso 2D • progresso independente')
 .replaceAll('Plataforma 2D sobrenatural. Corra, pule, use a relíquia e resolva casos curtos com progressão permanente.','Plataforma 2D multiverso. Corra, pule e lute em fases que mudam de identidade conforme a série escolhida.')
 .replaceAll('RELÍQUIA','ATAQUE')
 .replaceAll('Relíquia','Ataque')
 .replaceAll('relíquia','ataque');

// Mantém as expansões originais funcionando a partir do novo projeto.
for(const f of ['arquivo13-v4.js','arquivo13-v5.js','arquivo13-v6.js','arquivo13-v7.js']){
  source=source.replaceAll(`./${f}`,`${ROOT}${f}`);
}

const extraCss=`
.universeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.universeBtn{position:relative;min-height:92px;padding:11px;border-radius:14px;border:1px solid #344158;background:linear-gradient(145deg,#111827,#090d16);text-align:left;overflow:hidden}.universeBtn:active{transform:scale(.98)}.universeBtn b{display:block;font-size:12px}.universeBtn small{display:block;margin-top:5px;color:#92a2ba;font-size:8px;line-height:1.35}.universeBtn em{position:absolute;right:9px;top:8px;font-style:normal;font-size:18px;opacity:.9}.universeBtn[data-u="supernatural"]{border-color:#76589c}.universeBtn[data-u="titan"]{border-color:#8c744e}.universeBtn[data-u="jujutsu"]{border-color:#5950a6}.universeBtn[data-u="slayer"]{border-color:#396d6b}.universeTag{display:inline-flex;align-items:center;gap:6px;margin:0 0 7px;padding:5px 8px;border-radius:99px;border:1px solid #39445e;background:#0b111c;color:#d7e0ef;font-size:8px;font-weight:900}.seriesHint{color:#ffd98a!important}.worldBadge{position:absolute;top:105px;right:8px;z-index:8;padding:5px 7px;border-radius:8px;border:1px solid #39445e;background:#080b13dc;font-size:7px;font-weight:900;letter-spacing:.05em;pointer-events:none}
@media(max-width:390px){.universeGrid{grid-template-columns:1fr}.universeBtn{min-height:72px}}
`;
source=source.replace('</style>',extraCss+'</style>');
source=source.replace('<div class="toast" id="toast"></div>','<div class="toast" id="toast"></div><div class="worldBadge" id="worldBadge">NEXUS</div>');

const universeCode=String.raw`
const BASE_CASES=CASES.map(c=>({...c}));
const SERIES={
 supernatural:{name:'Sobrenatural',short:'CAÇADORES',icon:'✦',theme:0,accent:'#b88cff',cases:[
  ['Selo na Estrada','Cidade esquecida do Kansas','Uma sequência de mortes impossíveis termina sempre com o mesmo símbolo queimado no asfalto.','Demônio da Encruzilhada','Reúna 3 sinais, quebre o selo e alcance a criatura.'],
  ['A Casa que Respira','Bairro abandonado','As paredes registram vozes de pessoas desaparecidas e as portas mudam de lugar depois da meia-noite.','Espírito Vingativo','Encontre as manifestações e encerre a assombração.'],
  ['Floresta do Wendigo','Reserva interditada','Pegadas humanas viram garras no meio da mata. Há sobreviventes presos além da linha das árvores.','Wendigo Ancião','Siga as pistas e atravesse a mata antes que ele encontre você.'],
  ['Hotel do Quarto Selado','Estrada interestadual','O quarto trancado há décadas voltou a receber hóspedes — todos pelo mesmo número.','Bruxa do Espelho','Descubra o ritual e destrua a origem da maldição.'],
  ['A Última Encruzilhada','Marco 13','Todos os casos convergem para um pacto antigo. O preço vence ao amanhecer.','Príncipe do Inferno','Quebre o pacto e feche a passagem do Nexus.'] ]},
 titan:{name:'Attack on Titan',short:'MURALHAS',icon:'⚔',theme:2,accent:'#e1b76a',cases:[
  ['Brecha no Distrito','Muralha exterior','O alarme toca e uma abertura transforma as ruas em corredor de evacuação.','Titã Aberrante','Colete 3 sinais de rota e alcance o ponto de contenção.'],
  ['Telhados de Trost','Distrito urbano','A rota pelo chão foi perdida. O avanço agora depende dos telhados e das passagens estreitas.','Titã de Investida','Cruze o distrito e abra caminho até a linha de defesa.'],
  ['Bosque dos Gigantes','Área de reconhecimento','A formação foi quebrada dentro da floresta e algo maior acompanha a tropa pelas árvores.','Titã da Floresta','Localize os rastros e sobreviva até a clareira.'],
  ['Fortaleza Abandonada','Posto avançado','As paredes tremem por dentro. Há uma presença escondida entre os corredores da fortificação.','Titã Couraçado','Ative os pontos de defesa e enfrente a ruptura.'],
  ['Além da Muralha','Território desconhecido','A última expedição encontra a origem de uma sequência de ataques coordenados.','Titã Primordial','Atravesse o campo e conclua a expedição do Nexus.'] ]},
 jujutsu:{name:'Jujutsu Kaisen',short:'FEITICEIROS',icon:'◉',theme:4,accent:'#b697ff',cases:[
  ['Escola Sob Maldição','Colégio interditado','Uma cortina caiu sobre o prédio. A energia amaldiçoada aumenta a cada minuto.','Maldição de Grau Especial','Colete 3 vestígios e rompa a cortina.'],
  ['Estação Subterrânea','Linha bloqueada','Passageiros desapareceram entre duas plataformas e o túnel está saturado de energia amaldiçoada.','Maldição do Subsolo','Purifique os focos e avance até o núcleo.'],
  ['Domínio Incompleto','Templo em ruínas','O espaço dobra ao redor do templo e criaturas surgem de pontos que não deveriam existir.','Portador do Domínio','Encontre as âncoras e quebre o domínio antes de fechar.'],
  ['Hospital Desativado','Ala restrita','Uma concentração anormal de medo transformou a ala em território amaldiçoado.','Espírito da Agonia','Purifique os focos e alcance a sala central.'],
  ['Convergência','Nó do Nexus','Várias assinaturas de energia se fundiram em uma única presença.','Maldição do Nexus','Rompa a convergência e encerre a manifestação.'] ]},
 slayer:{name:'Demon Slayer',short:'CAÇADORES DE ONI',icon:'☾',theme:1,accent:'#72ddc9',cases:[
  ['Vila ao Anoitecer','Montanha remota','Moradores desaparecem quando as lanternas se apagam. Marcas conduzem para a encosta.','Oni da Névoa','Reúna 3 rastros e alcance o esconderijo antes do amanhecer.'],
  ['Trem da Madrugada','Linha noturna','Passageiros dormem e não conseguem acordar enquanto o trem segue sem parar.','Oni dos Sonhos','Atravesse os vagões e corte a origem do pesadelo.'],
  ['Bosque das Teias','Floresta montanhosa','Fios quase invisíveis controlam criaturas e bloqueiam o caminho entre as árvores.','Oni Aranha','Encontre os pontos da teia e chegue ao centro da floresta.'],
  ['Distrito das Lanternas','Bairro noturno','Uma presença se esconde entre as luzes e desaparece antes de cada ataque.','Lua Demoníaca','Siga os vestígios e force a criatura a se revelar.'],
  ['Castelo Mutável','Fortaleza impossível','Corredores mudam de posição enquanto a concentração de demônios cresce.','Lua Superior','Atravesse o castelo e feche a ruptura do Nexus.'] ]}
};
let selectedSeries='supernatural',launchingUniverse=false;
function universeData(){return SERIES[selectedSeries]||SERIES.supernatural}
function applyUniverse(){
 const u=universeData(),base=BASE_CASES[caseIndex],d=u.cases[caseIndex]||u.cases[0];
 CASES[caseIndex]={...base,title:d[0],sub:d[1],story:d[2],boss:d[3],goal:d[4],theme:u.theme};
 document.documentElement.style.setProperty('--purple',u.accent);
 const wb=document.getElementById('worldBadge');if(wb)wb.textContent=u.name.toUpperCase();
 const topTitle=document.querySelector('.top .title b');if(topTitle)topTitle.textContent='NEXUS — '+u.name.toUpperCase();
 const topSub=document.querySelector('.top .title small');if(topSub)topSub.textContent=u.short.toLowerCase()+' • progresso independente';
}
function chooseUniverse(){
 state='menu';overlay.classList.add('on');bossBar.classList.remove('on');
 const buttons=Object.keys(SERIES).map(function(k){const u=SERIES[k];return '<button class="universeBtn" data-u="'+k+'"><em>'+u.icon+'</em><b>'+u.name+'</b><small>'+u.short+' • '+u.cases[caseIndex][0]+'</small></button>'}).join('');
 panel.innerHTML='<div class="kicker">nexus // escolha o universo</div><h1>Onde será a próxima caçada?</h1><p class="seriesHint">A mecânica é a mesma. A série escolhida muda identidade visual, missão, inimigos e chefe desta fase.</p><div class="universeGrid">'+buttons+'</div><div class="btns"><button class="btn" id="universeBack">VOLTAR</button><button class="btn primary" id="universeRandom">ALEATÓRIO</button></div>';
 panel.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{selectedSeries=b.dataset.u;applyUniverse();launchingUniverse=true;startCase()});
 $('universeBack').onclick=menu;$('universeRandom').onclick=()=>{const ks=Object.keys(SERIES);selectedSeries=ks[Math.floor(Math.random()*ks.length)];applyUniverse();launchingUniverse=true;startCase()};
}
`;
source=source.replace('let save=loadSave();',universeCode+'\nlet save=loadSave();');
source=source.replace('function startCase(){initAudio();',"function startCase(){if(!launchingUniverse){chooseUniverse();return}launchingUniverse=false;initAudio();");

// Resultado final passa a ser coerente com qualquer universo escolhido.
source=source.replace(/\$\{caseIndex===0\?'O sino silenciou\.[\s\S]*?'O marco 13 desaba\.[\s\S]*?'\}/,"${'A missão foi concluída neste universo. A ruptura foi contida, mas outra coordenada do Nexus acaba de se abrir.'}");

// A tela inicial mantém o nome da apresentação.
source=source.replace('<div class="kicker">arquivo independente // campanha</div><h1>NEXUS</h1>','<div class="kicker">nexus // campanha multiverso</div><h1>Caçadas Entre Mundos</h1>');

document.open();document.write(source);document.close();
})().catch(err=>{console.error(err);const m=document.getElementById('msg');m.classList.add('err');m.textContent='Não foi possível carregar o núcleo do jogo. Verifique a conexão e tente novamente.'});
</script>
</body>
</html>
