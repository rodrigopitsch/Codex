<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jogo da Velha">
  <title>Jogo da Velha</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #0b1020;
      --card: rgba(24, 32, 57, .94);
      --line: #34405f;
      --x: #5eead4;
      --o: #fbbf24;
      --text: #f8fafc;
      --muted: #a8b3cc;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(94, 234, 212, .15), transparent 32%),
        radial-gradient(circle at 90% 85%, rgba(251, 191, 36, .13), transparent 34%),
        var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    main {
      width: min(100%, 430px);
      padding: 26px 20px 22px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
      text-align: center;
    }

    h1 { margin: 0 0 6px; font-size: clamp(28px, 8vw, 38px); letter-spacing: -.04em; }
    .subtitle { margin: 0 0 19px; color: var(--muted); font-size: 15px; }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      margin-bottom: 18px;
      border-radius: 15px;
      background: rgba(7, 11, 23, .72);
    }

    button { font: inherit; color: inherit; }

    .mode, #reset {
      min-height: 46px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .mode { background: transparent; color: var(--muted); font-weight: 700; }
    .mode.active { background: #26324f; color: var(--text); box-shadow: 0 2px 10px rgba(0,0,0,.22); }

    #status {
      min-height: 28px;
      margin: 0 0 14px;
      font-size: 19px;
      font-weight: 750;
    }

    .board {
      width: min(82vw, 350px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 9px;
      margin: 0 auto 18px;
    }

    .cell {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(9, 14, 29, .78);
      font-size: clamp(44px, 16vw, 72px);
      font-weight: 850;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .1s ease, border-color .2s ease, background .2s ease;
    }

    .cell:active { transform: scale(.95); }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win { border-color: currentColor; background: rgba(255,255,255,.1); animation: pulse .65s ease-in-out infinite alternate; }
    .cell:disabled { cursor: default; opacity: 1; }

    #reset {
      width: 100%;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: #041311;
      font-weight: 850;
      box-shadow: 0 8px 22px rgba(20,184,166,.2);
    }

    #reset:active { transform: translateY(1px); }

    @keyframes pulse { to { transform: scale(.96); } }
    @media (max-height: 690px) {
      main { padding-top: 18px; padding-bottom: 18px; }
      h1 { font-size: 28px; }
      .subtitle { margin-bottom: 12px; }
      .modes { margin-bottom: 12px; }
      .board { width: min(67vh, 82vw, 330px); margin-bottom: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Jogo da Velha</h1>
    <p class="subtitle">Toque em uma casa para jogar</p>

    <div class="modes" aria-label="Modo de jogo">
      <button class="mode active" data-mode="duo" type="button">2 jogadores</button>
      <button class="mode" data-mode="cpu" type="button">Contra o iPhone</button>
    </div>

    <p id="status" aria-live="polite">Vez do X</p>
    <div class="board" role="grid" aria-label="Tabuleiro do jogo da velha"></div>
    <button id="reset" type="button">Jogar novamente</button>
  </main>

  <script>
    const boardEl = document.querySelector('.board');
    const statusEl = document.querySelector('#status');
    const resetEl = document.querySelector('#reset');
    const modeButtons = [...document.querySelectorAll('.mode')];
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board = Array(9).fill('');
    let current = 'X';
    let mode = 'duo';
    let finished = false;
    let cpuThinking = false;

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', `Casa ${i + 1}, vazia`);
      cell.addEventListener('click', () => play(i));
      boardEl.appendChild(cell);
    }

    const cells = [...document.querySelectorAll('.cell')];

    function result(state = board) {
      for (const line of wins) {
        const [a, b, c] = line;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) return { winner: state[a], line };
      }
      return state.every(Boolean) ? { winner: 'draw', line: [] } : null;
    }

    function play(index) {
      if (finished || cpuThinking || board[index]) return;
      place(index, current);
      if (finishIfNeeded()) return;

      current = current === 'X' ? 'O' : 'X';
      updateStatus();

      if (mode === 'cpu' && current === 'O') {
        cpuThinking = true;
        updateStatus();
        setTimeout(() => {
          place(bestMove(), 'O');
          cpuThinking = false;
          if (!finishIfNeeded()) {
            current = 'X';
            updateStatus();
          }
        }, 320);
      }
    }

    function place(index, mark) {
      board[index] = mark;
      const cell = cells[index];
      cell.textContent = mark;
      cell.classList.add(mark.toLowerCase());
      cell.setAttribute('aria-label', `Casa ${index + 1}, ${mark}`);
    }

    function finishIfNeeded() {
      const gameResult = result();
      if (!gameResult) return false;
      finished = true;
      cells.forEach(cell => cell.disabled = true);
      gameResult.line.forEach(index => cells[index].classList.add('win'));
      statusEl.textContent = gameResult.winner === 'draw' ? 'Deu velha!' : `${gameResult.winner} venceu!`;
      return true;
    }

    function updateStatus() {
      statusEl.textContent = cpuThinking ? 'iPhone pensando…' : `Vez do ${current}`;
    }

    function bestMove() {
      let bestScore = -Infinity;
      let move = board.findIndex(v => !v);
      board.forEach((value, index) => {
        if (value) return;
        board[index] = 'O';
        const score = minimax(board, false);
        board[index] = '';
        if (score > bestScore) { bestScore = score; move = index; }
      });
      return move;
    }

    function minimax(state, maximizing) {
      const gameResult = result(state);
      if (gameResult) return gameResult.winner === 'O' ? 10 : gameResult.winner === 'X' ? -10 : 0;

      let score = maximizing ? -Infinity : Infinity;
      state.forEach((value, index) => {
        if (value) return;
        state[index] = maximizing ? 'O' : 'X';
        const next = minimax(state, !maximizing);
        state[index] = '';
        score = maximizing ? Math.max(score, next) : Math.min(score, next);
      });
      return score;
    }

    function reset() {
      board = Array(9).fill('');
      current = 'X';
      finished = false;
      cpuThinking = false;
      cells.forEach((cell, index) => {
        cell.textContent = '';
        cell.className = 'cell';
        cell.disabled = false;
        cell.setAttribute('aria-label', `Casa ${index + 1}, vazia`);
      });
      updateStatus();
    }

    resetEl.addEventListener('click', reset);
    modeButtons.forEach(button => button.addEventListener('click', () => {
      mode = button.dataset.mode;
      modeButtons.forEach(item => item.classList.toggle('active', item === button));
      reset();
    }));
  </script>
</body>
</html>
