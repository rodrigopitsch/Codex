(async()=>{
 const FINAL_FILES=["./index.html", "./index-core.html", "./jogo-da-velha.html", "./jogo-da-velha-core.html", "./ludo.html", "./ludo-core.html", "./paciencia-trilha.html", "./paciencia-trilha-core.html", "./poker.html", "./poker-core.html", "./ritual13.html", "./ritual13-core.html", "./ritual13-v6.css", "./ritual13-v6.js", "./hunt.html", "./hunt-core.html", "./occult-trail.html", "./occult-trail-core.html", "./arquivo13.html", "./arquivo13-v4.js", "./arquivo13-v5.js", "./arquivo13-v6.js", "./v4-enhance.css", "./v4-enhance.js", "./v5-social.css", "./v5-social.js", "./v7-ux.css", "./v7-ux.js", "./v8-hunt.css", "./v8-hunt.js", "./manifest.webmanifest", "./icon.svg"];
 try{
  const r=await fetch('./index-core.html',{cache:'reload'});if(!r||!r.ok)throw new Error('núcleo da sala indisponível');

  h=h.split('v17').join('v23');

  const scripts='<script src="./v7-ux.js"></'+'script><script>window.__SALA_RELEASE="v23";if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js?v=23",{updateViaCache:"none"}).catch(()=>{})</'+'script>';
  h=h.replace('</body>',scripts+'</body>');

 }catch(e){document.getElementById('msg').textContent='Não foi possível carregar a release v23. Reabra conectado.'}
