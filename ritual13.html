(()=>{'use strict';const C=7,R=12,S='ritual13StableV2',T=[['☾','#b9a5ff'],['✦','#ffe28a'],['◉','#82e5ff'],['♧','#8ef0bd'],['◇','#ff9fc0']],CASES=[['O Jardim que Sussurra',650,2,0],['Luzes no Lago',900,3,0],['A Estação sem Relógio',1200,3,1],['Casa das Janelas Azuis',1500,4,1],['O Quarto das Plantas',1850,4,1],['Cinema Aurora',2200,4,2],['O Elevador 13',2600,5,1],['Biblioteca das Margens',3000,5,2],['A Rua que Volta',3450,5,2],['Observatório Vazio',3900,5,2],['O Salão de Vidro',4400,5,3],['Linha Zero',5000,5,3]];const $=x=>document.getElementById(x),cv=$('game'),ctx=cv.getContext('2d'),stage=$('stage'),ov=$('overlay'),card=$('card');let P=load(),idx=Math.min(P.unlocked-1,11),b=[],p=null,next=null,score=0,rit=0,mult=1,playing=false,zen=false,busy=false,last=0,delay=900,cell=32,bx=0,by=0,w=0,h=0,start=null,timer=0,sound=P.sound!==false;
function load(){try{return Object.assign({unlocked:1,best:{},stars:{},sound:true},JSON.parse(localStorage.getItem(S)||'{}'))}catch(e){return{unlocked:1,best:{},stars:{},sound:true}}}function save(){P.sound=sound;localStorage.setItem(S,JSON.stringify(P))}function tone(f=440,d=.04){if(!sound)return;try{const A=tone.a||(tone.a=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.02;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('on'),900)}function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);cell=Math.max(24,Math.floor(Math.min((w-28)/C,(h-150)/R)));bx=(w-cell*C)/2;by=Math.max(65,(h-cell*R-70)/2)}window.addEventListener('resize',resize);visualViewport?.addEventListener('resize',resize);document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
function clear(){b=Array.from({length:R},()=>Array(C).fill(null))}function pair(n){return[~~(Math.random()*n),~~(Math.random()*n)]}function cells(x=p,r=x.r,c=x.c,o=x.o){const d=[[-1,0],[0,1],[1,0],[0,-1]][o];return[{r,c,t:x.a},{r:r+d[0],c:c+d[1],t:x.z}]}function can(r,c,o){return cells(p,r,c,o).every(q=>q.c>=0&&q.c<C&&q.r<R&&(q.r<0||!b[q.r][q.c]))}function spawn(){const n=zen?5:CASES[idx][2],q=next||pair(n);next=pair(n);p={a:q[0],z:q[1],r:1,c:3,o:0};if(!can(p.r,p.c,p.o)){end(false);return false}return true}function move(d){if(!playing||busy)return;if(can(p.r,p.c+d,p.o)){p.c+=d;tone(220)}}function rotate(){if(!playing||busy)return;const no=(p.o+1)%4;for(const k of[0,-1,1])if(can(p.r,p.c+k,no)){p.c+=k;p.o=no;tone(380);return}}function down(){if(!playing||busy)return;if(can(p.r+1,p.c,p.o))p.r++;else lock()}function drop(){if(!playing||busy)return;while(can(p.r+1,p.c,p.o)){p.r++;score++}lock()}function lock(){for(const q of cells())if(q.r>=0)b[q.r][q.c]={t:q.t};p=null;resolve()}
function key(r,c){return r+','+c}function groupSet(){const seen=new Set(),out=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(!b[r][c]||seen.has(key(r,c)))continue;const t=b[r][c].t,q=[[r,c]],g=[];seen.add(key(r,c));while(q.length){const[a,z]=q.pop();g.push([a,z]);for(const[d,e]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=a+d,nc=z+e,k=key(nr,nc);if(nr>=0&&nr<R&&nc>=0&&nc<C&&!seen.has(k)&&b[nr][nc]&&b[nr][nc].t===t){seen.add(k);q.push([nr,nc])}}}if(g.length>=4)out.push(g)}return out}function ritualTypes(){const s=new Set();for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const a=b[r][c],z=b[r][c+1],d=b[r+1][c],e=b[r+1][c+1];if(a&&z&&d&&e&&a.t===z.t&&a.t===d.t&&a.t===e.t)s.add(a.t)}return[...s]}function gravity(){for(let c=0;c<C;c++){let wr=R-1;for(let r=R-1;r>=0;r--)if(b[r][c]){b[wr][c]=b[r][c];if(wr!==r)b[r][c]=null;wr--}while(wr>=0)b[wr--][c]=null}}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function resolve(){busy=true;mult=1;while(true){let set=new Set(),rt=ritualTypes();if(rt.length){rit+=rt.length;for(const t of rt)for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(b[r][c]?.t===t)set.add(key(r,c));toast('RITUAL PERFEITO ✦');tone(700,.12)}else{const gs=groupSet();if(!gs.length)break;for(const g of gs)for(const q of g)set.add(key(q[0],q[1]))}if(!set.size)break;score+=set.size*25*mult;for(const k of set){const[r,c]=k.split(',').map(Number);b[r][c]=null}hud();await sleep(120);gravity();mult++;await sleep(100)}busy=false;if(mult>2)toast('CADEIA ×'+(mult-1));if(!zen&&score>=CASES[idx][1]&&rit>=CASES[idx][3]){end(true);return}mult=1;spawn();last=performance.now();hud()}
function hud(){const target=zen?0:CASES[idx][1];$('score').textContent=score;$('chain').textContent='×'+Math.max(1,mult-1);$('rituals').textContent=rit;$('goal').textContent=zen?'ZEN':score+' / '+target;$('goalbar').style.width=zen?'0%':Math.min(100,score/target*100)+'%'}function startGame(z=false){zen=z;score=0;rit=0;mult=1;delay=z?900:Math.max(560,930-idx*30);clear();next=null;spawn();playing=true;busy=false;ov.classList.remove('on');$('hint').classList.remove('hide');setTimeout(()=>$('hint').classList.add('hide'),5000);last=performance.now();hud()}function menu(){playing=false;ov.classList.add('on');card.innerHTML=`<div class="kick">novo puzzle independente</div><h1>Ritual 13</h1><p>Organize símbolos do Véu. Junte <b>4 iguais conectados</b>; faça um quadrado <b>2×2</b> para limpar uma família inteira.</p><div class="story"><b>${CASES[idx][0]}</b><small>Sem violência, sem cronômetro obrigatório. Aprenda em uma rodada.</small></div><div class="stats"><div class="stat"><b>${P.unlocked}</b><small>CASOS</small></div><div class="stat"><b>${P.best[idx]||0}</b><small>RECORDE</small></div><div class="stat"><b>${Object.values(P.stars).reduce((a,v)=>a+v,0)}</b><small>ESTRELAS</small></div></div><div class="btns"><button class="btn zen" id="zen">MODO ZEN</button><button class="btn primary" id="play">JOGAR CASO</button></div><div class="cases">${CASES.map((c,i)=>`<button class="case ${i>=P.unlocked?'lock':''}" data-i="${i}" ${i>=P.unlocked?'disabled':''}><b>${String(i+1).padStart(2,'0')} • ${c[0]}</b><small>${c[1]} pts${c[3]?' • '+c[3]+' ritual':''}</small></button>`).join('')}</div>`;$('play').onclick=()=>startGame(false);$('zen').onclick=()=>startGame(true);card.querySelectorAll('.case:not(.lock)').forEach(x=>x.onclick=()=>{idx=+x.dataset.i;menu()})}function end(win){playing=false;ov.classList.add('on');if(win){const target=CASES[idx][1],st=score>=target*1.7?3:score>=target*1.3?2:1;P.best[idx]=Math.max(P.best[idx]||0,score);P.stars[idx]=Math.max(P.stars[idx]||0,st);P.unlocked=Math.max(P.unlocked,Math.min(12,idx+2));save();card.innerHTML=`<div class="kick">caso estabilizado</div><h1>${CASES[idx][0]}</h1><p>${'★'.repeat(st)}${'☆'.repeat(3-st)} — Você encontrou o padrão.</p><div class="stats"><div class="stat"><b>${score}</b><small>PONTOS</small></div><div class="stat"><b>${rit}</b><small>RITUAIS</small></div><div class="stat"><b>${mult}</b><small>CADEIA</small></div></div><div class="btns"><button class="btn" id="menu">CASOS</button><button class="btn primary" id="next">PRÓXIMO</button></div>`;$('menu').onclick=menu;$('next').onclick=()=>{idx=Math.min(idx+1,P.unlocked-1);startGame(false)}}else{card.innerHTML=`<div class="kick">sem espaço</div><h1>O Véu fechou.</h1><p>Abra espaço com grupos de quatro ou com um Ritual 2×2.</p><div class="btns"><button class="btn" id="menu">CASOS</button><button class="btn primary" id="retry">TENTAR DE NOVO</button></div>`;$('menu').onclick=menu;$('retry').onclick=()=>startGame(zen)}}
function draw(){ctx.clearRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#191632');g.addColorStop(1,'#111126');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#17152b';ctx.strokeStyle='#4e496f';ctx.lineWidth=2;round(bx-5,by-5,cell*C+10,cell*R+10,14);ctx.fill();ctx.stroke();for(let r=0;r<R;r++)for(let c=0;c<C;c++){ctx.strokeStyle='#312e50';ctx.strokeRect(bx+c*cell,by+r*cell,cell,cell);if(b[r][c])tile(r,c,b[r][c].t,1)}if(p)for(const q of cells())if(q.r>=0)tile(q.r,q.c,q.t,.92)}function round(x,y,ww,hh,rr){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,ww,hh,rr):ctx.rect(x,y,ww,hh)}function tile(r,c,t,a){const x=bx+c*cell,y=by+r*cell,pad=3;ctx.globalAlpha=a;ctx.fillStyle=T[t][1];round(x+pad,y+pad,cell-pad*2,cell-pad*2,Math.max(7,cell*.25));ctx.fill();ctx.fillStyle='#201d39';ctx.globalAlpha=.22;ctx.fillRect(x+pad+2,y+pad+2,cell-pad*2-4,Math.max(4,cell*.18));ctx.globalAlpha=1;ctx.fillStyle='#201d39';ctx.font=`900 ${Math.max(15,cell*.52)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(T[t][0],x+cell/2,y+cell/2+1)}function loop(t){if(playing&&!busy&&t-last>delay){last=t;down()}draw();requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{if(!playing)return;start={x:e.clientX,y:e.clientY};cv.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});cv.addEventListener('pointerup',e=>{if(!playing||!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(dy>45&&Math.abs(dy)>Math.abs(dx)*.7)drop();else if(Math.abs(dx)>28){const n=Math.min(3,Math.max(1,Math.round(Math.abs(dx)/55)));for(let i=0;i<n;i++)move(dx>0?1:-1)}else rotate();start=null;e.preventDefault()},{passive:false});cv.addEventListener('pointercancel',()=>start=null);document.querySelectorAll('.ctl').forEach(x=>x.addEventListener('pointerdown',e=>{e.preventDefault();const a=x.dataset.a;if(a==='left')move(-1);if(a==='right')move(1);if(a==='rotate')rotate();if(a==='drop')drop()},{passive:false}));$('sound').onclick=()=>{sound=!sound;save();$('sound').textContent=sound?'♪':'×'};$('back').onclick=()=>{if(playing)menu();else location.href='index.html'};resize();menu();requestAnimationFrame(loop)})();
