<body>
<div class="app">
<header class="top"><button class="back" id="backBtn">‹</button><div class="title"><b>RITUAL 13 — LINHAS DO VÉU</b><small>puzzle sobrenatural • gestos simples • sem combate</small></div><div class="rank" id="rank">CASO 01</div><button class="iconBtn" id="soundBtn" aria-label="Som">♪</button></header>

<script>
(()=>{
'use strict';
const COLS=7,ROWS=12,STORE='ritual13ProgressV1';
const TYPES=[
 {id:0,g:'☾',c:'#b9a5ff',c2:'#7d68cc',name:'Lua'},
 {id:1,g:'✦',c:'#ffe28a',c2:'#d5a93d',name:'Estrela'},
 {id:2,g:'◉',c:'#82e5ff',c2:'#3a9fbd',name:'Olho'},
 {id:3,g:'♧',c:'#8ef0bd',c2:'#43a879',name:'Folha'},
 {id:4,g:'◇',c:'#ff9fc0',c2:'#c65382',name:'Cristal'}
];
const CASES=[
 {name:'O Jardim que Sussurra',story:'Luzes suaves surgem entre as flores depois da meia-noite. Organize os sinais para descobrir o padrão.',target:650,colors:2,rit:0,stones:0,speed:920},
 {name:'Luzes no Lago',story:'Reflexos aparecem onde não há estrelas. O desenho só faz sentido quando os símbolos se encontram.',target:900,colors:3,rit:0,stones:0,speed:880},
 {name:'A Estação sem Relógio',story:'Todos os relógios pararam às 03:13. O painel ainda responde a combinações perfeitas.',target:1200,colors:3,rit:1,stones:2,speed:850},
 {name:'Casa das Janelas Azuis',story:'A casa muda de posição, mas as janelas repetem a mesma sequência. Feche um Ritual para ancorá-la.',target:1500,colors:4,rit:1,stones:3,speed:820},
 {name:'O Quarto das Plantas',story:'Folhas crescem formando símbolos impossíveis. Quanto maior a cadeia, mais claro fica o recado.',target:1850,colors:4,rit:1,stones:4,speed:790},
 {name:'Cinema Aurora',story:'Um filme sem atores projeta apenas formas e cores. A sessão termina quando o padrão correto surge.',target:2200,colors:4,rit:2,stones:5,speed:760},
 {name:'O Elevador 13',story:'O botão treze não existe, mas acende sozinho. Cada reação em cadeia faz o elevador subir um andar.',target:2600,colors:5,rit:1,stones:5,speed:730},
 {name:'Biblioteca das Margens',story:'Notas aparecem nas bordas de livros antigos. Os símbolos querem ser agrupados, não lidos.',target:3000,colors:5,rit:2,stones:6,speed:700},
 {name:'A Rua que Volta',story:'Você anda três quarteirões e retorna ao início. Um circuito perfeito parece ser a única saída.',target:3450,colors:5,rit:2,stones:7,speed:680},
 {name:'Observatório Vazio',story:'O telescópio aponta para dentro do prédio. Os sinais agora reagem mais depressa.',target:3900,colors:5,rit:2,stones:8,speed:650},
 {name:'O Salão de Vidro',story:'Cada erro deixa um eco; cada cadeia o transforma em luz. O Véu está quase completamente mapeado.',target:4400,colors:5,rit:3,stones:8,speed:620},
 {name:'Linha Zero',story:'Todos os casos apontam para o mesmo desenho. Complete o último mapa e descubra o que havia atrás do Véu.',target:5000,colors:5,rit:3,stones:9,speed:590}
];
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),card=$('card'),stage=$('stage');
let prog=load(),caseIndex=Math.min(prog.unlocked-1,CASES.length-1),board=[],piece=null,nextPair=null,score=0,rituals=0,chain=1,playing=false,zen=false,lastFall=0,fallDelay=900,vw=0,vh=0,cell=36,bx=0,by=0,boardH=0,boardW=0,particles=[],floaters=[],shake=0,sound=prog.sound!==false,firstPlay=true,pointerStart=null,toastTimer=0,resolveBusy=false,motes=[];
function load(){try{return Object.assign({unlocked:1,stars:{},best:{},sound:true,totalRituals:0},JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return {unlocked:1,stars:{},best:{},sound:true,totalRituals:0}}}
function save(){prog.sound=sound;localStorage.setItem(STORE,JSON.stringify(prog))}
function tone(freq=440,d=.06,type='sine',vol=.035){if(!sound)return;try{const A=tone.ctx||(tone.ctx=new (window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function haptic(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function show(msg,ms=1000){const b=$('bubble');b.textContent=msg;b.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.remove('on'),ms)}
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);vw=r.width;vh=r.height;canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0);cell=Math.floor(Math.min((vw-28)/COLS,(vh-148)/ROWS));cell=Math.max(24,cell);boardW=cell*COLS;boardH=cell*ROWS;bx=Math.round((vw-boardW)/2);by=Math.max(62,Math.round((vh-boardH-74)/2));makeMotes()}
function makeMotes(){motes=Array.from({length:18},(_,i)=>({x:(i*73)%Math.max(vw,1),y:(i*113)%Math.max(vh,1),r:1+(i%3),a:.08+(i%4)*.025,v:.08+(i%5)*.015}))}
window.addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
function emptyBoard(){board=Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function addStones(n){let placed=0;while(placed<n){const r=ROWS-1-Math.floor(Math.random()*4),c=Math.floor(Math.random()*COLS);if(!board[r][c]){board[r][c]={stone:1};placed++}}}
function pair(colors){return [Math.floor(Math.random()*colors),Math.floor(Math.random()*colors)]}
function spawn(){const c=CASES[caseIndex]||CASES[0],colors=zen?5:c.colors,pp=nextPair||pair(colors);nextPair=pair(colors);piece={a:pp[0],b:pp[1],r:1,c:3,o:0};if(!can(piece.r,piece.c,piece.o)){fail();return false}return true}
const OFF=[[[-1,0]],[[0,1]],[[1,0]],[[0,-1]]];
function cellsOf(p=piece,r=p.r,c=p.c,o=p.o){const q=OFF[o][0];return [{r,c,t:p.a},{r:r+q[0],c:c+q[1],t:p.b}]}
function can(r,c,o){return cellsOf(piece,r,c,o).every(q=>q.c>=0&&q.c<COLS&&q.r<ROWS&&(q.r<0||!board[q.r][q.c]))}
function move(dx){if(!playing||resolveBusy)return;if(can(piece.r,piece.c+dx,piece.o)){piece.c+=dx;tone(240,.025,'square',.018)}}
function rotate(){if(!playing||resolveBusy)return;const no=(piece.o+1)%4;for(const kick of [0,-1,1,-2,2])if(can(piece.r,piece.c+kick,no)){piece.c+=kick;piece.o=no;tone(390,.035,'triangle',.025);return}}
function stepDown(){if(!playing||resolveBusy)return;if(can(piece.r+1,piece.c,piece.o)){piece.r++;tone(130,.018,'square',.008)}else lock()}
function hardDrop(){if(!playing||resolveBusy)return;let n=0;while(can(piece.r+1,piece.c,piece.o)){piece.r++;n++}score+=n;updateHud();tone(180,.05,'square',.025);lock()}
function lock(){for(const q of cellsOf())if(q.r>=0)board[q.r][q.c]={t:q.t};burstAtCells(cellsOf().filter(q=>q.r>=0),'#fff5c2',5);piece=null;resolveBoard()}
function key(r,c){return r+','+c}
function groups(){const seen=new Set(),out=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cellv=board[r][c];if(!cellv||cellv.stone||seen.has(key(r,c)))continue;const t=cellv.t,q=[[r,c]],g=[];seen.add(key(r,c));while(q.length){const [rr,cc]=q.pop();g.push([rr,cc]);for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=rr+dr,nc=cc+dc,k=key(nr,nc);if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!seen.has(k)&&board[nr][nc]&&!board[nr][nc].stone&&board[nr][nc].t===t){seen.add(k);q.push([nr,nc])}}}if(g.length>=4)out.push({t,cells:g})}return out}
function ritualTypes(){const s=new Set();for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++){const a=board[r][c],b=board[r][c+1],d=board[r+1][c],e=board[r+1][c+1];if(a&&b&&d&&e&&!a.stone&&!b.stone&&!d.stone&&!e.stone&&a.t===b.t&&a.t===d.t&&a.t===e.t)s.add(a.t)}return [...s]}
function adjacentStones(clearSet){const s=new Set();for(const k of clearSet){const [r,c]=k.split(',').map(Number);for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]&&board[nr][nc].stone)s.add(key(nr,nc))}}return s}
function gravity(){for(let c=0;c<COLS;c++){let w=ROWS-1;for(let r=ROWS-1;r>=0;r--)if(board[r][c]){if(r!==w){board[w][c]=board[r][c];board[r][c]=null}w--}for(;w>=0;w--)board[w][c]=null}}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function resolveBoard(){resolveBusy=true;chain=1;let any=false;while(true){const rits=ritualTypes();let clear=new Set(),rit=false;if(rits.length){rit=true;for(const t of rits)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]&&!board[r][c].stone&&board[r][c].t===t)clear.add(key(r,c));rituals+=rits.length;prog.totalRituals=(prog.totalRituals||0)+rits.length;show(rits.length>1?'RITUAL DUPLO!':'RITUAL PERFEITO!',1250);tone(660,.12,'sine',.045);setTimeout(()=>tone(880,.16,'sine',.04),70);shake=7;haptic()}else{const gs=groups();if(!gs.length)break;for(const g of gs)for(const [r,c] of g.cells)clear.add(key(r,c))}const stones=adjacentStones(clear);for(const k of stones)clear.add(k);if(!clear.size)break;any=true;const pts=clear.size*25*chain*(rit?2:1);score+=pts;for(const k of clear){const [r,c]=k.split(',').map(Number),v=board[r][c];if(v){burst(r,c,v.stone?'#c9c3d5':TYPES[v.t].c,9);floaters.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,text:'+'+Math.round(pts/clear.size),life:1})}board[r][c]=null}updateHud();tone(330+chain*80,.08,'triangle',.03);await sleep(155);gravity();chain++;updateHud();await sleep(120)}resolveBusy=false;if(any&&chain>2)show('CADEIA ×'+(chain-1)+' ✦',1000);if(!zen&&missionDone()){complete();return}chain=1;updateHud();spawn();lastFall=performance.now()}
function missionDone(){const c=CASES[caseIndex];return score>=c.target&&rituals>=c.rit}
function complete(){playing=false;const c=CASES[caseIndex],over=Math.max(0,score-c.target),star=score>=c.target*1.75?3:score>=c.target*1.3?2:1;prog.stars[caseIndex]=Math.max(prog.stars[caseIndex]||0,star);prog.best[caseIndex]=Math.max(prog.best[caseIndex]||0,score);prog.unlocked=Math.max(prog.unlocked,Math.min(CASES.length,caseIndex+2));save();tone(523,.14,'sine',.04);setTimeout(()=>tone(659,.15,'sine',.04),100);setTimeout(()=>tone(784,.2,'sine',.04),210);showEnd(true,star,over)}
function fail(){playing=false;tone(180,.25,'sine',.035);showEnd(false,0,0)}
function showEnd(win,stars,over){overlay.classList.add('on');const c=CASES[caseIndex];card.innerHTML=win?`<div class="kicker">caso estabilizado</div><h1>${c.name}</h1><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>Você reorganizou o sinal sem romper o Véu. O próximo arquivo já está disponível.</p><div class="stats"><div class="stat"><b>${score}</b><small>PONTOS</small></div><div class="stat"><b>${rituals}</b><small>RITUAIS</small></div><div class="stat"><b>${over}</b><small>EXTRA</small></div></div><div class="btns"><button class="btn" id="menuBtn">Casos</button><button class="btn primary" id="nextBtn">${caseIndex<CASES.length-1?'PRÓXIMO CASO':'JOGAR DE NOVO'}</button></div>`:`<div class="kicker">o véu se fechou</div><h1>Sem espaço</h1><p>Não foi um erro perdido: agora você já viu o padrão. Abra espaço com cadeias de quatro ou use um Ritual 2×2.</p><div class="stats"><div class="stat"><b>${score}</b><small>PONTOS</small></div><div class="stat"><b>${rituals}</b><small>RITUAIS</small></div><div class="stat"><b>${CASES[caseIndex].target}</b><small>ALVO</small></div></div><div class="btns"><button class="btn" id="menuBtn">Casos</button><button class="btn primary" id="retryBtn">TENTAR DE NOVO</button></div>`;$('#menuBtn').onclick=menu;if(win)$('#nextBtn').onclick=()=>{if(caseIndex<CASES.length-1)caseIndex=Math.min(caseIndex+1,prog.unlocked-1);start(false)};else $('#retryBtn').onclick=()=>start(false)}
function updateHud(){const c=CASES[caseIndex];$('#scoreText').textContent=score;$('#chainText').textContent='×'+Math.max(1,chain-1);$('#ritualText').textContent=rituals;if(zen){$('#goalText').textContent='ZEN';$('#goalBar').style.width='100%';$('#rank').textContent='MODO ZEN'}else{$('#goalText').textContent=score+' / '+c.target+ (c.rit?` • ${rituals}/${c.rit} R`:'');$('#goalBar').style.width=Math.min(100,score/c.target*100)+'%';$('#rank').textContent='CASO '+String(caseIndex+1).padStart(2,'0')}}
function start(isZen=false){zen=isZen;overlay.classList.remove('on');emptyBoard();score=0;rituals=0;chain=1;resolveBusy=false;particles=[];floaters=[];nextPair=null;const c=CASES[caseIndex];if(!zen)addStones(c.stones);fallDelay=zen?740:c.speed;playing=true;spawn();lastFall=performance.now();updateHud();$('#gestureHint').classList.remove('hide');setTimeout(()=>$('#gestureHint').classList.add('hide'),firstPlay?6500:2500);firstPlay=false;show(zen?'Respire. Sem objetivo, sem pressa.':c.name,1200)}
function menu(){playing=false;overlay.classList.add('on');const totalStars=Object.values(prog.stars).reduce((a,b)=>a+b,0);card.innerHTML=`<div class="kicker">arquivo de padrões anômalos</div><h1>Ritual 13</h1><p>Um puzzle de encaixe e combinação. Organize pares de símbolos, provoque reações em cadeia e descubra por que todos os casos apontam para o mesmo desenho.</p><div class="story"><b>Como jogar</b><small>Deslize para os lados • toque para girar • deslize para baixo para soltar. Quatro símbolos iguais conectados desaparecem. Um quadrado 2×2 igual cria um <b>Ritual</b> e limpa aquela família inteira.</small></div><div class="stats"><div class="stat"><b>${prog.unlocked}</b><small>CASOS</small></div><div class="stat"><b>${totalStars}</b><small>ESTRELAS</small></div><div class="stat"><b>${prog.totalRituals||0}</b><small>RITUAIS</small></div></div><div class="caseList" id="caseList"></div><div class="btns"><button class="btn zen" id="zenBtn">MODO ZEN</button><button class="btn primary" id="playBtn">JOGAR CASO</button></div><p class="tiny">Dica: o jogo não tem anúncio, energia nem cronômetro. Seu progresso fica salvo neste aparelho.</p>`;const list=$('#caseList');CASES.forEach((c,i)=>{const b=document.createElement('button');b.className='caseBtn '+(i>=prog.unlocked?'lock ':'')+(i===caseIndex?'current':'');const st=prog.stars[i]||0;b.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${c.name}</b><small>${c.target} pts${c.rit?' • '+c.rit+' ritual'+(c.rit>1?'s':''):''}</small><em>${i>=prog.unlocked?'🔒':'★'.repeat(st)+'☆'.repeat(3-st)}</em>`;if(i<prog.unlocked)b.onclick=()=>{caseIndex=i;menu()};list.appendChild(b)});$('#playBtn').onclick=()=>start(false);$('#zenBtn').onclick=()=>start(true);updateHud()}
function burst(r,c,color,n=8){const x=bx+(c+.5)*cell,y=by+(r+.5)*cell;for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.7)*4,life:.7+Math.random()*.35,color,s:2+Math.random()*3})}
function burstAtCells(cs,color,n){for(const q of cs)for(let i=0;i<n;i++)particles.push({x:bx+(q.c+.5)*cell,y:by+(q.r+.5)*cell,vx:(Math.random()-.5)*2,vy:(Math.random()-.7)*2,life:.35,color,s:1+Math.random()*2})}
function tile(x,y,t,alpha=1,scale=1){const T=TYPES[t],pad=3*scale,w=cell*scale-pad*2,rr=10*scale;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.shadowColor=T.c;ctx.shadowBlur=8*scale;round(-cell*scale/2+pad,-cell*scale/2+pad,w,w,rr);const grd=ctx.createLinearGradient(0,-w/2,0,w/2);grd.addColorStop(0,T.c);grd.addColorStop(1,T.c2);ctx.fillStyle=grd;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff26';round(-cell*scale/2+pad+3,-cell*scale/2+pad+3,w-6,Math.max(5,w*.18),5);ctx.fill();ctx.fillStyle='#2a2145';ctx.font=`900 ${Math.floor(cell*.45*scale)}px -apple-system,BlinkMacSystemFont,"Segoe UI Symbol",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(T.g,0,1);ctx.restore()}
function stoneTile(x,y){ctx.save();ctx.translate(x,y);round(-cell/2+4,-cell/2+4,cell-8,cell-8,9);const g=ctx.createLinearGradient(0,-cell/2,0,cell/2);g.addColorStop(0,'#77718a');g.addColorStop(1,'#454254');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#9b94aa55';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#c9c3d5';ctx.font=`800 ${Math.floor(cell*.25)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('×',0,0);ctx.restore()}
function round(x,y,w,h,r){const m=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+m,y);ctx.arcTo(x+w,y,x+w,y+h,m);ctx.arcTo(x+w,y+h,x,y+h,m);ctx.arcTo(x,y+h,x,y,m);ctx.arcTo(x,y,x+w,y,m);ctx.closePath()}
function drawBackground(t){ctx.clearRect(0,0,vw,vh);for(const m of motes){m.y-=m.v;if(m.y<-8)m.y=vh+8;ctx.globalAlpha=m.a;ctx.fillStyle='#fff7df';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const halo=ctx.createRadialGradient(vw*.5,by+boardH*.35,20,vw*.5,by+boardH*.35,boardW*.75);halo.addColorStop(0,'#8b70d010');halo.addColorStop(1,'#0000');ctx.fillStyle=halo;ctx.fillRect(0,0,vw,vh)}
function drawBoard(){ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.83;if(shake<.3)shake=0}round(bx-7,by-7,boardW+14,boardH+14,18);ctx.fillStyle='#0f0e22d9';ctx.fill();ctx.strokeStyle='#5a537e';ctx.lineWidth=1.5;ctx.stroke();for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=bx+(c+.5)*cell,y=by+(r+.5)*cell;ctx.strokeStyle='#49436545';ctx.lineWidth=1;round(x-cell/2+2,y-cell/2+2,cell-4,cell-4,8);ctx.stroke();const v=board[r][c];if(v){if(v.stone)stoneTile(x,y);else tile(x,y,v.t)}}if(piece)for(const q of cellsOf())if(q.r>=0)tile(bx+(q.c+.5)*cell,by+(q.r+.5)*cell,q.t,1,1);ctx.restore()}
function drawNext(){if(!nextPair)return;const x=bx+boardW+8;if(x+42>vw)return;ctx.fillStyle='#aaa2c4';ctx.font='800 7px sans-serif';ctx.textAlign='left';ctx.fillText('PRÓX.',x,by+20);const s=Math.min(26,cell*.65),old=cell;cell=s;tile(x+s/2,by+43,nextPair[0],.95,1);tile(x+s/2,by+43+s,nextPair[1],.95,1);cell=old}
function drawParticles(dt){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;for(const f of floaters){f.y-=.35;f.life-=dt;ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#fff6cf';ctx.font='900 10px sans-serif';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}floaters=floaters.filter(f=>f.life>0);ctx.globalAlpha=1}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing&&!resolveBusy&&t-lastFall>fallDelay){lastFall=t;stepDown()}drawBackground(t);drawBoard();drawNext();drawParticles(dt);requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{if(!playing)return;canvas.setPointerCapture?.(e.pointerId);pointerStart={x:e.clientX,y:e.clientY,t:performance.now()};e.preventDefault()},{passive:false});
canvas.addEventListener('pointerup',e=>{if(!playing||!pointerStart)return;const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y,ax=Math.abs(dx),ay=Math.abs(dy);if(dy>45&&ay>ax*.75)hardDrop();else if(ax>32&&ax>ay*.75){const n=Math.min(3,Math.max(1,Math.round(ax/55)));for(let i=0;i<n;i++)move(dx>0?1:-1)}else rotate();pointerStart=null;e.preventDefault()},{passive:false});
canvas.addEventListener('pointercancel',()=>pointerStart=null);
document.querySelectorAll('.ctl').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.act;if(a==='left')move(-1);if(a==='right')move(1);if(a==='rotate')rotate();if(a==='drop')hardDrop();tone(260,.025,'square',.015)},{passive:false})});
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')rotate();if(e.key==='ArrowDown')hardDrop()});
$('#backBtn').onclick=()=>{if(playing){playing=false;menu()}else location.href='index.html'};$('#soundBtn').onclick=()=>{sound=!sound;save();$('#soundBtn').textContent=sound?'♪':'×';if(sound)tone(520,.08)};$('#soundBtn').textContent=sound?'♪':'×';
document.addEventListener('visibilitychange',()=>{if(document.hidden)lastFall=performance.now()+600000;else lastFall=performance.now()});
resize();menu();requestAnimationFrame(loop);
})();
</script>
</body>
