<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}

.title{flex:1;min-width:0}.title b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{font-size:9px;color:#b7afcb}
.main{min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 8px max(8px,env(safe-area-inset-bottom));gap:7px}

.box{background:#17152ee8;border:1px solid #514b79;border-radius:11px;padding:6px 7px;min-width:0}.box small{display:block;font-size:7px;color:#aaa2c4;font-weight:900;letter-spacing:.04em}.box b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:5px;background:#2d2948;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7edfff,#85f0c4);transition:width .2s}
.gameRow{width:min(100%,460px);min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:7px;align-items:center}
.boardWrap{min-width:0;min-height:0;display:grid;place-items:center;height:100%}
.board{width:min(100%,390px);max-height:100%;aspect-ratio:7/11;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(11,1fr);gap:2px;padding:5px;background:#17152b;border:2px solid #544e78;border-radius:17px;box-shadow:0 15px 40px #0007,inset 0 0 40px #6f55a01f;overflow:hidden}
.cell{position:relative;min-width:0;min-height:0;border:1px solid #302d50;border-radius:7px;background:#1b1932;display:grid;place-items:center;overflow:hidden}.cell::after{content:"";position:absolute;inset:2px;border-radius:5px;background:linear-gradient(#ffffff10,transparent);pointer-events:none}
.tile{width:100%;height:100%;display:grid;place-items:center;border-radius:6px;color:#211d39;font-weight:950;font-size:clamp(14px,5.5vw,25px);text-shadow:0 1px #ffffff40;box-shadow:inset 0 -4px #0002,0 0 9px var(--glow);transform:scale(.94)}
.tile.active{outline:2px solid #fff9;transform:scale(.98)}.tile.ghost{opacity:.2;filter:saturate(.7);outline:1px dashed #fff7}.tile.flash{animation:pop .22s ease-in-out 2 alternate}
.t0{background:linear-gradient(#d4c7ff,#a48ae9);--glow:#b9a5ff88}.t1{background:linear-gradient(#fff0ae,#e2bd57);--glow:#ffe28a88}.t2{background:linear-gradient(#b5f2ff,#5ec4df);--glow:#82e5ff88}.t3{background:linear-gradient(#baf7d3,#64c999);--glow:#8ef0bd88}.t4{background:linear-gradient(#ffc2d5,#e16f9c);--glow:#ff9fc088}
.side{align-self:stretch;display:flex;flex-direction:column;gap:7px;justify-content:center}.nextBox{padding:7px 4px;border:1px solid #4d4770;border-radius:12px;background:#18162f;text-align:center}.nextBox small{font-size:7px;color:#a9a1bd;font-weight:900}.nextPair{display:grid;gap:4px;margin:5px auto 0;width:38px}.mini{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:#211d39;font-size:19px;font-weight:950;box-shadow:inset 0 -3px #0002}.legend{padding:7px 5px;border:1px solid #413b62;border-radius:12px;background:#16142b;text-align:center;color:#bdb5ce;font-size:7px;line-height:1.45}.legend b{color:#fff4b8;font-size:8px}
.message{width:min(100%,460px);min-height:28px;padding:6px 9px;border:1px solid #454067;border-radius:10px;background:#17152ee6;text-align:center;color:#d2cada;font-size:9px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}.message.good{border-color:#477a68;color:#bcf5df;background:#133129}.message.warn{border-color:#755834;color:#ffe4a4;background:#302313}
.controls{width:min(100%,460px);display:grid;grid-template-columns:1fr 1.25fr 1fr 1.2fr;gap:7px;flex:0 0 auto}.ctl{min-height:57px;border-radius:17px;border:1px solid #5a5480;background:#292647;font-size:22px;font-weight:950;box-shadow:0 5px 14px #0004}.ctl:active{transform:translateY(2px);filter:brightness(1.15)}.rot{background:#42366a;border-color:#7f6aae}.drop{background:#285046;border-color:#54887c;color:#c6ffeb}.ctl[disabled]{opacity:.35;transform:none}
.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:#0a0919e9;overflow:auto;touch-action:pan-y}.overlay.on{display:grid}.card{width:min(100%,480px);padding:18px;border-radius:23px;border:1px solid #514b77;background:linear-gradient(#29254b,#17152f);box-shadow:0 28px 80px #000a}.kick{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:#e8c5ff}.card h1{margin:5px 0 8px;font-size:27px}.card p{margin:0 0 12px;color:#c4bdd6;font-size:12px;line-height:1.45}.story{padding:10px;border-radius:12px;background:#1b1934;border:1px solid #4c4770;margin:10px 0}.story b{font-size:11px}.story small{display:block;margin-top:4px;color:#b2aac8;font-size:9px;line-height:1.4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{padding:9px;border-radius:11px;background:#18162e;border:1px solid #47426a;text-align:center}.stat b{display:block;font-size:16px}.stat small{font-size:7px;color:#9e96b6}.btns{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}.btn{min-height:49px;border-radius:13px;border:1px solid #4c476c;background:#24213e;font-weight:900}.primary{border:0;background:linear-gradient(135deg,#9165c6,#5f448e)}.zen{background:#173c35;border-color:#47796c;color:#baf5df}.continue{grid-column:1/-1;background:#283f5f;border-color:#54769e;color:#d9edff}.cases{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:240px;overflow:auto;touch-action:pan-y;margin:10px 0}.case{padding:9px;border:1px solid #47416a;background:#1a1833;border-radius:12px;text-align:left}.case.lock{opacity:.38}.case.current{border-color:#9275bd;background:#292044}.case b{font-size:9px;display:block}.case small{font-size:8px;color:#aaa2bd}.tiny{font-size:8px!important;color:#8f87a5!important;margin:10px 0 0!important;text-align:center}
@keyframes pop{to{transform:scale(.78);filter:brightness(1.7)}}
@media(max-height:760px){header{min-height:50px;padding-top:max(4px,env(safe-area-inset-top))}.main{gap:4px}.controls{gap:5px}.ctl{min-height:50px}.message{min-height:24px}.box{padding:4px 6px}.gameRow{grid-template-columns:minmax(0,1fr) 54px}.nextPair{width:32px}.legend{font-size:6px}}
@media(max-width:370px){.gameRow{grid-template-columns:minmax(0,1fr) 50px}.ctl{font-size:19px}.controls{gap:5px}.title b{font-size:12px}}
</style>

<body>
<div class="app">
<header><button class="back" id="back" aria-label="Voltar">‹</button><div class="title"><b>RITUAL 13 — LINHAS DO VÉU</b><small>puzzle sobrenatural • sem canvas • progresso local</small></div><button class="sound" id="sound" aria-label="Som">♪</button></header>
<main class="main">
<div class="hud"><div class="box"><small>OBJETIVO</small><b id="goal">0 / 650</b><div class="bar"><i id="goalbar"></i></div></div><div class="box"><small>PONTOS</small><b id="score">0</b></div><div class="box"><small>CADEIA</small><b id="chain">×1</b></div><div class="box"><small>RITUAIS</small><b id="rituals">0</b></div></div>
<div class="gameRow"><div class="boardWrap"><div class="board" id="board" aria-label="Tabuleiro"></div></div><aside class="side"><div class="nextBox"><small>PRÓXIMA</small><div class="nextPair" id="nextPair"></div></div><div class="legend"><b>4 iguais</b><br>limpam<br><br><b>2×2</b><br>Ritual</div></aside></div>
<div class="message" id="message">Escolha um caso para começar.</div>
<div class="controls"><button class="ctl" data-a="left" aria-label="Esquerda">←</button><button class="ctl rot" data-a="rotate" aria-label="Girar">↻</button><button class="ctl" data-a="right" aria-label="Direita">→</button><button class="ctl drop" data-a="drop" aria-label="Soltar">⇣</button></div>
</main>
</div>
<div class="overlay on" id="overlay"><div class="card" id="card"></div></div>
<script>
(function(){
'use strict';
var COLS=7,ROWS=11,STORE='ritual13V4Progress',ROUND='ritual13V4Round';
var TYPES=[{g:'☾',name:'Lua'},{g:'✦',name:'Estrela'},{g:'◉',name:'Olho'},{g:'♧',name:'Folha'},{g:'◇',name:'Cristal'}];
var CASES=[
{name:'O Jardim que Sussurra',story:'Luzes aparecem entre as flores. Comece juntando apenas Lua e Estrela.',target:450,colors:2,rit:0,speed:1050},
{name:'Luzes no Lago',story:'O reflexo muda quando os símbolos se encontram.',target:650,colors:3,rit:0,speed:1000},
{name:'A Estação sem Relógio',story:'Os relógios pararam às 03:13. Um quadrado perfeito reativa o painel.',target:850,colors:3,rit:1,speed:960},
{name:'Casa das Janelas Azuis',story:'As janelas repetem padrões que só se estabilizam com um Ritual.',target:1050,colors:4,rit:1,speed:920},
{name:'O Quarto das Plantas',story:'As folhas crescem em grupos e respondem a reações em cadeia.',target:1300,colors:4,rit:1,speed:880},
{name:'Cinema Aurora',story:'O filme sem atores termina quando dois Rituais aparecem.',target:1550,colors:4,rit:2,speed:840},
{name:'O Elevador 13',story:'Cada cadeia parece empurrar o elevador um andar acima.',target:1800,colors:5,rit:1,speed:800},
{name:'Biblioteca das Margens',story:'Símbolos nas margens dos livros se agrupam sozinhos.',target:2100,colors:5,rit:2,speed:770},
{name:'A Rua que Volta',story:'O caminho retorna ao início até um circuito perfeito ser fechado.',target:2400,colors:5,rit:2,speed:740},
{name:'Observatório Vazio',story:'O telescópio aponta para dentro do prédio. Os sinais aceleram.',target:2750,colors:5,rit:2,speed:710},
{name:'O Salão de Vidro',story:'Cada reação em cadeia ilumina uma nova parte do mapa.',target:3150,colors:5,rit:3,speed:680},
{name:'Linha Zero',story:'Todos os casos apontam para o mesmo desenho. Feche a última linha.',target:3600,colors:5,rit:3,speed:650}];
function $(id){return document.getElementById(id)}
var boardEl=$('board'),overlay=$('overlay'),card=$('card'),messageEl=$('message');
var board=[],piece=null,nextPair=null,score=0,rituals=0,chain=1,caseIndex=0,playing=false,zen=false,resolving=false,timer=null,sound=true;
var prog=loadProgress();caseIndex=Math.max(0,Math.min(CASES.length-1,(prog.unlocked||1)-1));sound=prog.sound!==false;
function defaultProgress(){return{unlocked:1,best:{},stars:{},sound:true,totalRituals:0}}
function loadProgress(){try{var raw=localStorage.getItem(STORE);if(!raw)return defaultProgress();var x=JSON.parse(raw);var d=defaultProgress();for(var k in x)d[k]=x[k];return d}catch(e){return defaultProgress()}}
function saveProgress(){prog.sound=sound;try{localStorage.setItem(STORE,JSON.stringify(prog))}catch(e){}}
function saveRound(){if(!playing||resolving)return;try{localStorage.setItem(ROUND,JSON.stringify({board:board,piece:piece,nextPair:nextPair,score:score,rituals:rituals,chain:chain,caseIndex:caseIndex,zen:zen}))}catch(e){}}
function getRound(){try{var s=localStorage.getItem(ROUND);return s?JSON.parse(s):null}catch(e){return null}}
function clearRound(){try{localStorage.removeItem(ROUND)}catch(e){}}
function tone(freq,dur){if(!sound)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ac=tone.ac||(tone.ac=new AC());var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq||420;g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(dur||.05));o.stop(ac.currentTime+(dur||.05))}catch(e){}}
function setMessage(txt,type){messageEl.textContent=txt;messageEl.className='message'+(type?' '+type:'')}
function emptyBoard(){board=[];for(var r=0;r<ROWS;r++){var row=[];for(var c=0;c<COLS;c++)row.push(null);board.push(row)}}
function randomPair(n){return[Math.floor(Math.random()*n),Math.floor(Math.random()*n)]}
function offset(o){return[[-1,0],[0,1],[1,0],[0,-1]][o]}
function pieceCells(p,r,c,o){p=p||piece;if(!p)return[];r=typeof r==='number'?r:p.r;c=typeof c==='number'?c:p.c;o=typeof o==='number'?o:p.o;var d=offset(o);return[{r:r,c:c,t:p.a},{r:r+d[0],c:c+d[1],t:p.b}]}
function canAt(r,c,o){if(!piece)return false;var cs=pieceCells(piece,r,c,o);for(var i=0;i<cs.length;i++){var q=cs[i];if(q.c<0||q.c>=COLS||q.r>=ROWS)return false;if(q.r>=0&&board[q.r][q.c]!==null)return false}return true}
function spawn(){var n=zen?5:CASES[caseIndex].colors;var p=nextPair||randomPair(n);nextPair=randomPair(n);piece={a:p[0],b:p[1],r:1,c:3,o:0};if(!canAt(piece.r,piece.c,piece.o)){gameOver();return false}render();saveRound();return true}
function move(dx){if(!playing||resolving||!piece)return;if(canAt(piece.r,piece.c+dx,piece.o)){piece.c+=dx;tone(230,.025);render();saveRound()}}
function rotate(){if(!playing||resolving||!piece)return;var no=(piece.o+1)%4;var kicks=[0,-1,1,-2,2];for(var i=0;i<kicks.length;i++){var nc=piece.c+kicks[i];if(canAt(piece.r,nc,no)){piece.c=nc;piece.o=no;tone(390,.035);render();saveRound();return}}}
function stepDown(){if(!playing||resolving||!piece)return;if(canAt(piece.r+1,piece.c,piece.o)){piece.r++;render();saveRound()}else lockPiece()}
function hardDrop(){if(!playing||resolving||!piece)return;var dist=0;while(canAt(piece.r+1,piece.c,piece.o)){piece.r++;dist++}score+=dist*2;tone(170,.05);lockPiece()}
function lockPiece(){if(!piece)return;var cs=pieceCells();for(var i=0;i<cs.length;i++){var q=cs[i];if(q.r<0){gameOver();return}board[q.r][q.c]=q.t}piece=null;render();resolveBoard()}
function key(r,c){return r+','+c}
function findGroups(){var seen={},out=[];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){if(board[r][c]===null||seen[key(r,c)])continue;var t=board[r][c],stack=[[r,c]],group=[];seen[key(r,c)]=1;while(stack.length){var q=stack.pop(),rr=q[0],cc=q[1];group.push(q);var ns=[[rr+1,cc],[rr-1,cc],[rr,cc+1],[rr,cc-1]];for(var i=0;i<ns.length;i++){var nr=ns[i][0],nc=ns[i][1],kk=key(nr,nc);if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!seen[kk]&&board[nr][nc]===t){seen[kk]=1;stack.push([nr,nc])}}}if(group.length>=4)out.push({t:t,cells:group})}return out}
function findRitualTypes(){var found={};for(var r=0;r<ROWS-1;r++)for(var c=0;c<COLS-1;c++){var a=board[r][c],b=board[r][c+1],d=board[r+1][c],e=board[r+1][c+1];if(a!==null&&a===b&&a===d&&a===e)found[a]=1}var out=[];for(var k in found)out.push(Number(k));return out}
function gravity(){for(var c=0;c<COLS;c++){var wr=ROWS-1;for(var r=ROWS-1;r>=0;r--){if(board[r][c]!==null){board[wr][c]=board[r][c];if(wr!==r)board[r][c]=null;wr--}}while(wr>=0){board[wr][c]=null;wr--}}}
function delay(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
async function resolveBoard(){if(resolving)return;resolving=true;disableControls(true);chain=1;var had=false;while(true){var clear={},rits=findRitualTypes(),ritualHit=false;if(rits.length){ritualHit=true;rituals+=rits.length;prog.totalRituals=(prog.totalRituals||0)+rits.length;for(var ri=0;ri<rits.length;ri++){var typ=rits[ri];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(board[r][c]===typ)clear[key(r,c)]=1}setMessage(rits.length>1?'RITUAL DUPLO!':'RITUAL PERFEITO!','good');tone(720,.12)}else{var groups=findGroups();if(!groups.length)break;for(var gi=0;gi<groups.length;gi++)for(var ci=0;ci<groups[gi].cells.length;ci++){var q=groups[gi].cells[ci];clear[key(q[0],q[1])]=1}}var keys=[];for(var kk in clear)keys.push(kk);if(!keys.length)break;had=true;score+=keys.length*25*chain*(ritualHit?2:1);flashKeys(keys);await delay(120);for(var x=0;x<keys.length;x++){var parts=keys[x].split(',');board[Number(parts[0])][Number(parts[1])]=null}gravity();chain++;render();await delay(130)}resolving=false;disableControls(false);if(had&&chain>2)setMessage('CADEIA ×'+(chain-1)+' — boa leitura!','good');else if(!had)setMessage('Procure quatro iguais conectados ou um quadrado 2×2.');updateHud();if(!zen&&missionDone()){completeCase();return}chain=1;spawn()}
function flashKeys(keys){render();for(var i=0;i<keys.length;i++){var el=document.querySelector('[data-pos="'+keys[i]+'"] .tile');if(el)el.classList.add('flash')}}
function missionDone(){var c=CASES[caseIndex];return score>=c.target&&rituals>=c.rit}
function completeCase(){playing=false;stopTimer();clearRound();var c=CASES[caseIndex],stars=score>=c.target*1.7?3:score>=c.target*1.3?2:1;prog.best[caseIndex]=Math.max(prog.best[caseIndex]||0,score);prog.stars[caseIndex]=Math.max(prog.stars[caseIndex]||0,stars);prog.unlocked=Math.max(prog.unlocked,Math.min(CASES.length,caseIndex+2));saveProgress();overlay.classList.add('on');card.innerHTML='<div class="kick">caso estabilizado</div><h1>'+c.name+'</h1><p>'+'★'.repeat(stars)+'☆'.repeat(3-stars)+' — Você encontrou o padrão.</p><div class="stats"><div class="stat"><b>'+score+'</b><small>PONTOS</small></div><div class="stat"><b>'+rituals+'</b><small>RITUAIS</small></div><div class="stat"><b>'+(chain>1?chain-1:1)+'</b><small>CADEIA</small></div></div><div class="btns"><button class="btn" id="menuBtn">CASOS</button><button class="btn primary" id="nextBtn">PRÓXIMO</button></div>';$('menuBtn').onclick=menu;$('nextBtn').onclick=function(){caseIndex=Math.min(caseIndex+1,prog.unlocked-1);startGame(false)}}
function gameOver(){playing=false;stopTimer();clearRound();overlay.classList.add('on');card.innerHTML='<div class="kick">sem espaço</div><h1>O Véu fechou.</h1><p>Não perdeu progresso da campanha. Abra espaço com grupos de quatro ou use um Ritual 2×2.</p><div class="stats"><div class="stat"><b>'+score+'</b><small>PONTOS</small></div><div class="stat"><b>'+rituals+'</b><small>RITUAIS</small></div><div class="stat"><b>'+CASES[caseIndex].target+'</b><small>ALVO</small></div></div><div class="btns"><button class="btn" id="menuBtn">CASOS</button><button class="btn primary" id="retryBtn">TENTAR DE NOVO</button></div>';$('menuBtn').onclick=menu;$('retryBtn').onclick=function(){startGame(zen)}}
function startTimer(){stopTimer();timer=setInterval(function(){stepDown()},zen?950:CASES[caseIndex].speed)}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function startGame(isZen){zen=!!isZen;score=0;rituals=0;chain=1;resolving=false;emptyBoard();piece=null;nextPair=null;playing=true;overlay.classList.remove('on');disableControls(false);spawn();setMessage(zen?'Modo Zen: sem meta e sem pressa.':'Caso '+(caseIndex+1)+': '+CASES[caseIndex].name);updateHud();startTimer();saveRound()}
function resumeGame(){var s=getRound();if(!s)return menu();try{board=s.board;piece=s.piece;nextPair=s.nextPair;score=s.score||0;rituals=s.rituals||0;chain=s.chain||1;caseIndex=Math.max(0,Math.min(CASES.length-1,s.caseIndex||0));zen=!!s.zen;if(!Array.isArray(board)||board.length!==ROWS)throw new Error('round');playing=true;resolving=false;overlay.classList.remove('on');disableControls(false);setMessage('Rodada restaurada exatamente do último movimento.','good');render();updateHud();startTimer()}catch(e){clearRound();startGame(false)}}
function menu(){playing=false;stopTimer();overlay.classList.add('on');render();var total=0;for(var k in prog.stars)total+=Number(prog.stars[k])||0;var round=getRound();var html='<div class="kick">puzzle sobrenatural de padrões</div><h1>Ritual 13</h1><p>Junte <b>4 símbolos iguais conectados</b>. Um quadrado <b>2×2</b> cria um Ritual e limpa aquela família inteira.</p><div class="story"><b>'+CASES[caseIndex].name+'</b><small>'+CASES[caseIndex].story+'</small></div><div class="stats"><div class="stat"><b>'+prog.unlocked+'</b><small>CASOS</small></div><div class="stat"><b>'+total+'</b><small>ESTRELAS</small></div><div class="stat"><b>'+(prog.totalRituals||0)+'</b><small>RITUAIS</small></div></div><div class="btns"><button class="btn zen" id="zenBtn">MODO ZEN</button><button class="btn primary" id="playBtn">JOGAR CASO</button>'+(round?'<button class="btn continue" id="continueBtn">▶ CONTINUAR RODADA</button>':'')+'</div><div class="cases">';for(var i=0;i<CASES.length;i++){var locked=i>=prog.unlocked;html+='<button class="case '+(locked?'lock ':'')+(i===caseIndex?'current':'')+'" data-i="'+i+'" '+(locked?'disabled':'')+'><b>'+String(i+1).padStart(2,'0')+' • '+CASES[i].name+'</b><small>'+CASES[i].target+' pts'+(CASES[i].rit?' • '+CASES[i].rit+' ritual'+(CASES[i].rit>1?'s':''):'')+'</small></button>'}html+='</div><p class="tiny">V4: tabuleiro HTML, sem canvas. O jogo salva a rodada depois de cada movimento.</p>';card.innerHTML=html;$('playBtn').onclick=function(){startGame(false)};$('zenBtn').onclick=function(){startGame(true)};if($('continueBtn'))$('continueBtn').onclick=resumeGame;var buttons=card.querySelectorAll('.case:not(.lock)');for(var j=0;j<buttons.length;j++)buttons[j].onclick=function(){caseIndex=Number(this.getAttribute('data-i'));menu()}}
function updateHud(){var target=zen?0:CASES[caseIndex].target;$('score').textContent=score;$('chain').textContent='×'+Math.max(1,chain-1);$('rituals').textContent=rituals;$('goal').textContent=zen?'ZEN':score+' / '+target;$('goalbar').style.width=zen?'0%':Math.min(100,score/target*100)+'%';renderNext()}
function ghostCells(){if(!piece)return[];var rr=piece.r;while(canAt(rr+1,piece.c,piece.o))rr++;return pieceCells(piece,rr,piece.c,piece.o)}
function render(){var active={},ghost={};if(piece){var cs=pieceCells();for(var i=0;i<cs.length;i++)if(cs[i].r>=0)active[key(cs[i].r,cs[i].c)]=cs[i].t;var gs=ghostCells();for(var g=0;g<gs.length;g++)if(gs[g].r>=0)ghost[key(gs[g].r,gs[g].c)]=gs[g].t}var frag=document.createDocumentFragment();for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var cell=document.createElement('div');cell.className='cell';cell.setAttribute('data-pos',key(r,c));var val=board[r]&&board[r][c]!==undefined?board[r][c]:null;var kk=key(r,c),typ=null,cls='';if(Object.prototype.hasOwnProperty.call(active,kk)){typ=active[kk];cls=' active'}else if(val!==null){typ=val}else if(Object.prototype.hasOwnProperty.call(ghost,kk)){typ=ghost[kk];cls=' ghost'}if(typ!==null){var t=document.createElement('div');t.className='tile t'+typ+cls;t.textContent=TYPES[typ].g;cell.appendChild(t)}frag.appendChild(cell)}boardEl.innerHTML='';boardEl.appendChild(frag);updateHud()}
function renderNext(){var el=$('nextPair');if(!el)return;el.innerHTML='';if(!nextPair)return;for(var i=0;i<2;i++){var d=document.createElement('div');d.className='mini t'+nextPair[i];d.textContent=TYPES[nextPair[i]].g;el.appendChild(d)}}
function disableControls(v){var xs=document.querySelectorAll('.ctl');for(var i=0;i<xs.length;i++)xs[i].disabled=!!v}
var controls=document.querySelectorAll('.ctl');for(var ci=0;ci<controls.length;ci++)controls[ci].onclick=function(){var a=this.getAttribute('data-a');if(a==='left')move(-1);else if(a==='right')move(1);else if(a==='rotate')rotate();else if(a==='drop')hardDrop()};
$('sound').onclick=function(){sound=!sound;saveProgress();$('sound').textContent=sound?'♪':'×';if(sound)tone(520,.07)};$('sound').textContent=sound?'♪':'×';
$('back').onclick=function(){if(playing){saveRound();menu()}else{location.href='index.html'}};
document.addEventListener('visibilitychange',function(){if(document.hidden){saveRound();stopTimer()}else if(playing){startTimer()}});
window.addEventListener('beforeunload',function(){saveRound()});
emptyBoard();render();menu();
if(navigator.webdriver){window.Ritual13Test={state:function(){return{board:board,piece:piece,score:score,rituals:rituals,caseIndex:caseIndex,playing:playing,unlocked:prog.unlocked}},start:function(i){caseIndex=i||0;startGame(false)},drop:hardDrop,move:move,rotate:rotate,forceWin:function(){score=CASES[caseIndex].target;rituals=CASES[caseIndex].rit;completeCase()}}}
})();
</script>
