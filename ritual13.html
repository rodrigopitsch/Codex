<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1b"><title>Ritual 13 — carregando</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#080d1b;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{text-align:center;padding:24px}b{display:block;font-size:20px}p{color:#9aa9c3;font-size:12px}</style></head><body><main><b>Ritual 13</b><p id="msg">Carregando versão final…</p></main><script>
(async()=>{
 const core="./ritual13-core.html", css=[], js=[];
 try{
  let r=await fetch(core,{cache:'reload'}); if(!r||!r.ok) throw new Error('núcleo indisponível');
  let h=await r.text();
  const links=css.map(x=>'<link rel="stylesheet" href="./'+x+'">').join('');
  const scripts=js.map(x=>'<script src="./'+x+'"><\\/script>').join('')+"<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js?v=18',{updateViaCache:'none'}).catch(()=>{})<\\/script>";
  h=h.replace('</head>',links+'</head>').replace('</body>',scripts+'</body>');
  document.open();document.write(h);document.close();
 }catch(e){document.getElementById('msg').textContent='Não foi possível carregar o pacote final. Abra a Sala conectado e aguarde OFFLINE COMPLETO v18.'}
})();
</script></body></html>
