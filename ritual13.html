<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}

body{min-height:100dvh;background:radial-gradient(circle at 50% -12%,#5b3f78 0,#2c264f 27%,#16132e 58%,#0f1021 100%);padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(100%,520px);margin:auto;display:grid;gap:8px}
.top{display:grid;grid-template-columns:44px 1fr 54px;align-items:center;gap:8px}.back,.sound{height:42px;border:1px solid var(--line);border-radius:13px;background:#262241;font-weight:900}.back{font-size:25px}.sound{font-size:10px}.brand{text-align:center}.brand b{display:block;font-size:15px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
.hud{display:grid;grid-template-columns:1.35fr .75fr .75fr .75fr;gap:5px}.hud>div{padding:7px;border:1px solid #4d476f;border-radius:11px;background:#191730dd}.hud small{display:block;color:#aaa2c4;font-size:7px;font-weight:900}.hud b{display:block;margin-top:1px;font-size:12px}.meter{height:5px;margin-top:4px;background:#302c4d;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#85dcff,#85efbd)}
.game{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:start}.boardWrap{position:relative;padding:8px;border:1px solid #4d476f;border-radius:18px;background:linear-gradient(#181631,#121126);box-shadow:0 18px 45px #0007}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;aspect-ratio:7/10}.cell{position:relative;min-width:0;border:1px solid #302c4e;border-radius:9px;background:#0e1022;display:grid;place-items:center;overflow:hidden}.cell::after{content:"";position:absolute;inset:3px;border-radius:6px;border:1px solid #ffffff06}.cell.land{outline:2px solid #fff4;outline-offset:-2px}.tile{width:88%;height:88%;display:grid;place-items:center;border-radius:9px;font-size:clamp(16px,6vw,26px);font-weight:900;color:#28223b;box-shadow:inset 0 2px #ffffff55,0 5px 10px #0004;transform:translateZ(0)}.t0{background:linear-gradient(#d6c7ff,#9e86dd)}.t1{background:linear-gradient(#fff0a7,#e8be54)}.t2{background:linear-gradient(#a9efff,#5ac3df)}.t3{background:linear-gradient(#b4f2cf,#65c796)}.t4{background:linear-gradient(#ffc2d6,#e875a1)}.stone{background:linear-gradient(#817b92,#4b4759);color:#ddd6e8}.clearFlash{animation:pop .18s ease both}@keyframes pop{50%{transform:scale(1.12)}to{transform:scale(.86);opacity:.3}}
.side{display:grid;gap:7px}.sideBox{padding:8px;border:1px solid #4c466f;border-radius:13px;background:#1a1833}.sideBox small{display:block;color:#aaa2c4;font-size:7px;font-weight:900}.pair{display:flex;justify-content:center;gap:5px;margin-top:6px}.mini{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#29233b;font-size:16px;font-weight:900;box-shadow:inset 0 2px #ffffff55}.pieceView{min-height:100px;display:grid;place-items:center}.piece{display:grid;gap:4px}.piece.v{grid-template-columns:42px}.piece.h{grid-template-columns:42px 42px}.piece .mini{width:42px;height:42px;font-size:21px}.colLabel{text-align:center;color:#d2cae3;font-size:9px;font-weight:800;margin-top:4px}.tip{padding:7px;border:1px solid #4c466f;border-radius:11px;background:#17152e;color:#c5bdd7;font-size:8px;line-height:1.35}
.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.35fr;gap:7px}.ctl{min-height:58px;border:1px solid #5a5480;border-radius:16px;background:#292646;font-size:20px;font-weight:900;box-shadow:0 7px 16px #0003}.ctl:active{transform:translateY(2px)}.rotate{background:#443667;border-color:#7e69ad}.drop{background:linear-gradient(135deg,#2b715e,#245044);border-color:#64a28e;color:#e9fff7}.drop small{display:block;font-size:8px;letter-spacing:.05em}
.toast{position:fixed;z-index:50;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:8px 12px;border-radius:999px;background:#fff8e9;color:#2c2644;font-size:10px;font-weight:900;transition:.16s}.toast.on{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:#080817e8;overflow:auto;touch-action:pan-y}.overlay.on{display:grid}.card{width:min(100%,470px);padding:18px;border:1px solid #5b5380;border-radius:23px;background:linear-gradient(#2d2851,#191631);box-shadow:0 28px 80px #000b}.kick{color:#e9caff;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.card h1{margin:4px 0 8px;font-size:27px}.card p{margin:0 0 11px;color:#c5bdd8;font-size:12px;line-height:1.45}.story{padding:10px;border:1px solid #4e4771;border-radius:12px;background:#1b1934}.story b{font-size:11px}.story small{display:block;margin-top:4px;color:#b5acc8;font-size:9px;line-height:1.4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{padding:9px;border:1px solid #4d466d;border-radius:11px;background:#17152d;text-align:center}.stat b{display:block;font-size:16px}.stat small{font-size:7px;color:#9e96b6}.btns{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}.btn{min-height:49px;border:1px solid #544d76;border-radius:13px;background:#25213f;font-weight:900}.primary{border:0;background:linear-gradient(135deg,#9a68c7,#604591)}.zen{background:#173c35;border-color:#47796c;color:#baf5df}.resume{grid-column:1/-1;background:#263c62;border-color:#5c7fb3}.cases{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:260px;overflow:auto;touch-action:pan-y;margin:10px 0}.case{padding:9px;border:1px solid #4c456d;border-radius:11px;background:#1a1833;text-align:left}.case.lock{opacity:.35}.case.current{border-color:#a97ad3;background:#2c2146}.case b{display:block;font-size:9px}.case small{display:block;margin-top:3px;color:#aca4be;font-size:8px}.case em{display:block;margin-top:3px;color:#ffe48a;font-style:normal;font-size:8px}.help{margin-top:10px;color:#9189a8;font-size:8px;line-height:1.45;text-align:center}
@media(max-width:390px){.game{grid-template-columns:1fr 80px;gap:6px}.piece.v{grid-template-columns:36px}.piece.h{grid-template-columns:36px 36px}.piece .mini{width:36px;height:36px}.controls{gap:5px}.ctl{min-height:54px;font-size:18px}.hud b{font-size:10px}}

<body>
<main class="app">
 <div class="top"><button class="back" id="back" aria-label="Voltar">‹</button><div class="brand"><b>RITUAL 13 — LINHAS DO VÉU</b><small>V4 • puzzle por turnos • sem canvas • offline</small></div><button class="sound" id="sound">SOM ON</button></div>
 <div class="hud"><div><small>OBJETIVO</small><b id="goal">0 / 650</b><div class="meter"><i id="goalbar"></i></div></div><div><small>PONTOS</small><b id="score">0</b></div><div><small>CADEIA</small><b id="chain">×1</b></div><div><small>RITUAIS</small><b id="rituals">0</b></div></div>
 <section class="game">
  <div class="boardWrap"><div class="board" id="board"></div></div>
  <aside class="side">
   <div class="sideBox"><small>PEÇA ATUAL</small><div class="pieceView" id="pieceView"></div><div class="colLabel" id="colLabel">coluna 4</div></div>
   <div class="sideBox"><small>PRÓXIMA</small><div class="pair" id="nextPair"></div></div>
   <div class="tip">Toque numa coluna ou use ← →. Gire e depois <b>SOLTE</b>. 4 iguais conectados somem. Um quadrado 2×2 igual limpa aquela família inteira.</div>
  </aside>
 </section>
 <div class="controls"><button class="ctl" data-act="left">←</button><button class="ctl rotate" data-act="rotate">↻</button><button class="ctl" data-act="right">→</button><button class="ctl drop" data-act="drop">⇣<small>SOLTAR</small></button></div>
</main>
<div class="toast" id="toast"></div>
<div class="overlay on" id="overlay"><div class="card" id="card"></div></div>
<script>
(function(){
'use strict';
var COLS=7, ROWS=10, PROFILE='ritual13V4Profile', ROUND='ritual13V4Round';
var TYPES=[
 {g:'☾',name:'Lua',cls:'t0'},
 {g:'✦',name:'Estrela',cls:'t1'},
 {g:'◉',name:'Olho',cls:'t2'},
 {g:'♧',name:'Folha',cls:'t3'},
 {g:'◇',name:'Cristal',cls:'t4'}
];
var CASES=[
 {name:'O Jardim que Sussurra',story:'Luzes surgem entre as flores depois da meia-noite. Organize os primeiros sinais.',target:500,colors:2,rit:0,stones:0},
 {name:'Luzes no Lago',story:'Reflexos aparecem onde não há estrelas. As linhas começam a se repetir.',target:750,colors:3,rit:0,stones:0},
 {name:'A Estação sem Relógio',story:'Todos os relógios pararam às 03:13. Um quadrado perfeito parece destravar o painel.',target:950,colors:3,rit:1,stones:0},
 {name:'Casa das Janelas Azuis',story:'As janelas mudam de lugar. Fechar um Ritual mantém a casa no mesmo endereço.',target:1200,colors:3,rit:1,stones:1},
 {name:'O Quarto das Plantas',story:'Folhas formam padrões impossíveis nas paredes. Agora há mais famílias de símbolos.',target:1450,colors:4,rit:1,stones:2},
 {name:'Cinema Aurora',story:'A tela projeta apenas formas e cores. Reações em cadeia avançam o filme.',target:1700,colors:4,rit:1,stones:2},
 {name:'O Elevador 13',story:'O botão treze não existe, mas acende sozinho. Cada limpeza faz o elevador subir.',target:1950,colors:4,rit:2,stones:3},
 {name:'Biblioteca das Margens',story:'Notas aparecem nas bordas dos livros. Os sinais querem ser agrupados, não lidos.',target:2200,colors:4,rit:2,stones:3},
 {name:'A Rua que Volta',story:'Você anda três quarteirões e retorna ao início. Um circuito perfeito abre a saída.',target:2450,colors:5,rit:2,stones:4},
 {name:'Observatório Vazio',story:'O telescópio aponta para dentro do prédio. As combinações agora exigem espaço.',target:2700,colors:5,rit:2,stones:4},
 {name:'O Salão de Vidro',story:'Cada cadeia vira luz no teto. O mapa do Véu está quase completo.',target:3000,colors:5,rit:3,stones:5},
 {name:'Linha Zero',story:'Todos os casos apontam para o mesmo desenho. Feche a última sequência.',target:3400,colors:5,rit:3,stones:5}
];
function $(id){return document.getElementById(id)}
var board=[], piece=null, next=null, score=0, rituals=0, chain=1, playing=false, zen=false, caseIndex=0, profile=loadProfile(), sound=profile.sound!==false, toastTimer=0;
caseIndex=Math.max(0,Math.min(CASES.length-1,(profile.unlocked||1)-1));
function loadProfile(){
 var base={unlocked:1,stars:{},best:{},sound:true,totalRituals:0};
 try{
  var v=JSON.parse(localStorage.getItem(PROFILE)||'null');
  if(v) return Object.assign(base,v);
  var old=JSON.parse(localStorage.getItem('ritual13StableV3')||localStorage.getItem('ritual13StableV2')||'null');
  if(old){base.unlocked=old.unlocked||1;base.stars=old.stars||{};base.best=old.best||{};base.sound=old.sound!==false;}
 }catch(e){}
 return base;
}
function saveProfile(){profile.sound=sound;try{localStorage.setItem(PROFILE,JSON.stringify(profile))}catch(e){}}
function blank(){board=[];for(var r=0;r<ROWS;r++){var row=[];for(var c=0;c<COLS;c++)row.push(null);board.push(row)}}
function cloneBoard(b){return b.map(function(row){return row.map(function(v){return v?Object.assign({},v):null})})}
function rnd(n){return Math.floor(Math.random()*n)}
function newPair(){var colors=zen?5:CASES[caseIndex].colors;return {a:rnd(colors),b:rnd(colors),ori:0,col:3}}
function addStones(n){var tries=0;while(n>0&&tries<100){tries++;var r=ROWS-1-rnd(3),c=rnd(COLS);if(!board[r][c]){board[r][c]={stone:1};n--}}}
function normalizePiece(){if(!piece)return;if(piece.ori===1)piece.col=Math.max(0,Math.min(COLS-2,piece.col));else piece.col=Math.max(0,Math.min(COLS-1,piece.col))}
function landingCells(){
 if(!piece)return null;normalizePiece();
 if(piece.ori===0){
  var first=ROWS;for(var r=0;r<ROWS;r++){if(board[r][piece.col]){first=r;break}}
  var bottom=first-1,top=bottom-1;if(top<0)return null;
  return [{r:top,c:piece.col,t:piece.a},{r:bottom,c:piece.col,t:piece.b}];
 }
 var c1=piece.col,c2=piece.col+1,first1=ROWS,first2=ROWS;
 for(var r1=0;r1<ROWS;r1++){if(board[r1][c1]){first1=r1;break}}
 for(var r2=0;r2<ROWS;r2++){if(board[r2][c2]){first2=r2;break}}
 var row=Math.min(first1,first2)-1;if(row<0)return null;
 return [{r:row,c:c1,t:piece.a},{r:row,c:c2,t:piece.b}];
}
function move(d){if(!playing||!piece)return;piece.col+=d;normalizePiece();saveRound();render()}
function rotate(){if(!playing||!piece)return;piece.ori=piece.ori?0:1;normalizePiece();saveRound();render();beep(360)}
function drop(){
 if(!playing||!piece)return;var cells=landingCells();if(!cells){gameOver();return}
 for(var i=0;i<cells.length;i++){var q=cells[i];board[q.r][q.c]={t:q.t}}
 score+=Math.max(1,ROWS-Math.max(cells[0].r,cells[1].r));
 resolveBoard();
 if(!playing)return;
 piece=next||newPair();next=newPair();normalizePiece();saveRound();render();beep(220);
}
function key(r,c){return r+','+c}
function ritualTypes(){
 var set={};for(var r=0;r<ROWS-1;r++)for(var c=0;c<COLS-1;c++){
  var a=board[r][c],b=board[r][c+1],d=board[r+1][c],e=board[r+1][c+1];
  if(a&&b&&d&&e&&!a.stone&&!b.stone&&!d.stone&&!e.stone&&a.t===b.t&&a.t===d.t&&a.t===e.t)set[a.t]=1;
 }
 return Object.keys(set).map(Number);
}
function groups(){
 var seen={},out=[];
 for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
  var v=board[r][c],k=key(r,c);if(!v||v.stone||seen[k])continue;
  var t=v.t,q=[[r,c]],g=[];seen[k]=1;
  while(q.length){var cur=q.pop(),rr=cur[0],cc=cur[1];g.push(cur);var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
   for(var i=0;i<dirs.length;i++){var nr=rr+dirs[i][0],nc=cc+dirs[i][1],nk=key(nr,nc);if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!seen[nk]&&board[nr][nc]&&!board[nr][nc].stone&&board[nr][nc].t===t){seen[nk]=1;q.push([nr,nc])}}
  }
  if(g.length>=4)out.push(g);
 }
 return out;
}
function gravity(){
 for(var c=0;c<COLS;c++){
  var wr=ROWS-1;
  for(var r=ROWS-1;r>=0;r--){if(board[r][c]){if(wr!==r){board[wr][c]=board[r][c];board[r][c]=null}wr--}}
  while(wr>=0){board[wr][c]=null;wr--}
 }
}
function resolveBoard(){
 chain=1;var did=false,guard=0;
 while(guard++<20){
  var clear={},rits=ritualTypes(),ritual=false;
  if(rits.length){ritual=true;rituals+=rits.length;profile.totalRituals=(profile.totalRituals||0)+rits.length;
   for(var x=0;x<rits.length;x++){var t=rits[x];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(board[r][c]&&!board[r][c].stone&&board[r][c].t===t)clear[key(r,c)]=1}
   show(rits.length>1?'RITUAL DUPLO!':'RITUAL PERFEITO!');beep(700);
  }else{
   var gs=groups();if(!gs.length)break;for(var gi=0;gi<gs.length;gi++)for(var j=0;j<gs[gi].length;j++)clear[key(gs[gi][j][0],gs[gi][j][1])]=1;
  }
  var ks=Object.keys(clear);if(!ks.length)break;did=true;score+=ks.length*25*chain*(ritual?2:1);
  for(var i=0;i<ks.length;i++){var p=ks[i].split(','),rr=+p[0],cc=+p[1];board[rr][cc]=null}
  gravity();chain++;
 }
 if(did&&chain>2)show('CADEIA ×'+(chain-1));
 saveProfile();
 if(!zen&&missionDone()){complete();return}
 chain=1;
}
function missionDone(){var c=CASES[caseIndex];return score>=c.target&&rituals>=c.rit}
function complete(){
 playing=false;clearRound();var c=CASES[caseIndex],stars=score>=c.target*1.7?3:score>=c.target*1.3?2:1;
 profile.stars[caseIndex]=Math.max(profile.stars[caseIndex]||0,stars);profile.best[caseIndex]=Math.max(profile.best[caseIndex]||0,score);profile.unlocked=Math.max(profile.unlocked,Math.min(CASES.length,caseIndex+2));saveProfile();
 showEnd(true,stars);
}
function gameOver(){playing=false;clearRound();showEnd(false,0)}
function saveRound(){if(!playing)return;try{localStorage.setItem(ROUND,JSON.stringify({caseIndex:caseIndex,zen:zen,board:board,piece:piece,next:next,score:score,rituals:rituals,chain:chain}))}catch(e){}}
function clearRound(){try{localStorage.removeItem(ROUND)}catch(e){}}
function readRound(){try{return JSON.parse(localStorage.getItem(ROUND)||'null')}catch(e){return null}}
function resumeRound(){var s=readRound();if(!s)return;caseIndex=Math.max(0,Math.min(11,s.caseIndex||0));zen=!!s.zen;board=cloneBoard(s.board||[]);if(board.length!==ROWS){clearRound();menu();return}piece=s.piece||newPair();next=s.next||newPair();score=s.score||0;rituals=s.rituals||0;chain=s.chain||1;playing=true;normalizePiece();$('overlay').classList.remove('on');render();show('Rodada retomada')}
function startGame(z){zen=!!z;blank();score=0;rituals=0;chain=1;if(!zen)addStones(CASES[caseIndex].stones);piece=newPair();next=newPair();playing=true;$('overlay').classList.remove('on');saveRound();render();show(zen?'Modo Zen':'Caso '+(caseIndex+1))}
function tileHTML(t,mini){var T=TYPES[t];return '<span class="'+(mini?'mini ':'tile ')+T.cls+'">'+T.g+'</span>'}
function render(){
 var ghost=landingCells(),land={};if(ghost)for(var z=0;z<ghost.length;z++)land[key(ghost[z].r,ghost[z].c)]=1;
 var html='';for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var v=board[r]&&board[r][c],cls='cell'+(land[key(r,c)]?' land':'');html+='<button class="'+cls+'" data-col="'+c+'" aria-label="Coluna '+(c+1)+'">';if(v)html+=v.stone?'<span class="tile stone">×</span>':tileHTML(v.t,false);html+='</button>'}
 $('board').innerHTML=html;
 var ph='<div class="piece '+(piece&&piece.ori?'h':'v')+'">';if(piece){ph+=tileHTML(piece.a,true)+tileHTML(piece.b,true)}ph+='</div>';$('pieceView').innerHTML=ph;$('colLabel').textContent='coluna '+((piece?piece.col:0)+1)+(piece&&piece.ori?'–'+(piece.col+2):'');
 $('nextPair').innerHTML=next?tileHTML(next.a,true)+tileHTML(next.b,true):'';
 $('score').textContent=score;$('rituals').textContent=rituals;$('chain').textContent='×'+Math.max(1,chain-1);
 if(zen){$('goal').textContent='ZEN';$('goalbar').style.width='0%'}else{var cse=CASES[caseIndex];$('goal').textContent=score+' / '+cse.target+(cse.rit?' • R '+rituals+'/'+cse.rit:'');$('goalbar').style.width=Math.min(100,score/cse.target*100)+'%'}
 $('sound').textContent=sound?'SOM ON':'SOM OFF';
}
function menu(){
 playing=false;$('overlay').classList.add('on');var total=0;Object.keys(profile.stars||{}).forEach(function(k){total+=profile.stars[k]||0});var round=readRound();
 var h='<div class="kick">puzzle sobrenatural • V4</div><h1>Ritual 13</h1><p>Agora o jogo é totalmente por turnos: sem canvas, sem queda automática e sem gestos obrigatórios. Escolha a coluna, gire e solte.</p><div class="story"><b>'+CASES[caseIndex].name+'</b><small>'+CASES[caseIndex].story+'</small></div><div class="stats"><div class="stat"><b>'+profile.unlocked+'</b><small>CASOS</small></div><div class="stat"><b>'+total+'</b><small>ESTRELAS</small></div><div class="stat"><b>'+(profile.totalRituals||0)+'</b><small>RITUAIS</small></div></div><div class="cases" id="caseList"></div><div class="btns">';
 if(round)h+='<button class="btn resume" id="resumeBtn">CONTINUAR RODADA</button>';
 h+='<button class="btn zen" id="zenBtn">MODO ZEN</button><button class="btn primary" id="playBtn">JOGAR CASO</button></div><div class="help">Quatro iguais conectados desaparecem. Um quadrado 2×2 igual ativa Ritual e limpa aquela família inteira. Não existe cronômetro, energia ou anúncio.</div>';
 $('card').innerHTML=h;var list=$('caseList');
 for(var i=0;i<CASES.length;i++){var b=document.createElement('button');b.className='case '+(i>=profile.unlocked?'lock ':'')+(i===caseIndex?'current':'');var st=profile.stars[i]||0;b.innerHTML='<b>'+String(i+1).padStart(2,'0')+' · '+CASES[i].name+'</b><small>'+CASES[i].target+' pts'+(CASES[i].rit?' • '+CASES[i].rit+' ritual'+(CASES[i].rit>1?'s':''):'')+'</small><em>'+(i>=profile.unlocked?'BLOQUEADO':'★'.repeat(st)+'☆'.repeat(3-st))+'</em>';

function beep(freq){if(!sound)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var a=beep.ctx||(beep.ctx=new AC()),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq||300;g.gain.value=.015;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.04);o.stop(a.currentTime+.04)}catch(e){}}

 try{

  piece={a:1,b:1,ori:1,col:2};drop();piece={a:1,b:1,ori:1,col:2};drop();assert(rituals>=1,'ritual 2x2 limpa família');

  assert(board.length===ROWS&&board[0].length===COLS,'60 turnos sem estrutura quebrada');
 }catch(e){out.error=String(e&&e.message||e)}

}
blank();render();menu();
